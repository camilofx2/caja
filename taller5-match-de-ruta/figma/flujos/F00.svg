<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560"><rect id="Fondo" x="0" y="0" width="1500" height="560" fill="#F4F4F5"/><text y="67" font-family="Space Mono" font-size="18" font-weight="700" fill="#084FE9" letter-spacing="1.08"><tspan x="60" dy="0">04 · USER FLOWS</tspan></text>
<text y="126" font-family="Space Grotesk" font-size="48" font-weight="700" fill="#1F1F1F"><tspan x="60" dy="0">User flows por funcionalidad</tspan></text>
<text y="168" font-family="Space Grotesk" font-size="20" font-weight="400" fill="#52525B"><tspan x="60" dy="0">25 flujos, uno por cada nodo de la arquitectura. Cada flujo empieza y termina en una cápsula gris y se lee de arriba hacia abajo.</tspan></text>
