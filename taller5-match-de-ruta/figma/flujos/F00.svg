<text y="447" font-family="Space Mono" font-size="18" font-weight="400" fill="#52525B"><tspan x="60" dy="0">Índice: 01–04 Acceso · 05–08 Verificación · 09–12 Inicio y Mis rutas · 13–16 Matches · 17–19 Trayecto activo · 20–23 Perfil ·</tspan><tspan x="60" dy="25">24–25 Confianza y contacto avisado</tspan></text></svg>