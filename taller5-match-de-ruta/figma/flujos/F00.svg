<text y="275" font-family="Space Grotesk" font-size="15" font-weight="700" fill="#1F1F1F"><tspan x="160" dy="0"></tspan></text>
<text y="377" font-family="Space Grotesk" font-size="18" font-weight="700" fill="#1F1F1F"><tspan x="60" dy="0">Inicio / fin</tspan></text>
