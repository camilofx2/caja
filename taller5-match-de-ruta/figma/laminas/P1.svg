<text y="390" font-family="Space Grotesk" font-size="72" font-weight="700" fill="#0B1B3F"><tspan x="206" dy="0">D</tspan></text>
<text y="487" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#FFFFFF"><tspan x="156" dy="0">Daniela Gómez, 22 años</tspan></text>
<text y="524" font-family="Space Grotesk" font-size="18" font-weight="400" fill="#C7D7FB"><tspan x="156" dy="0">Estudiante de 8.º semestre de Comunicación Social ·</tspan><tspan x="156" dy="26">Vive en Bosa, estudia en Chapinero (Bogotá) · Sale de</tspan><tspan x="156" dy="26">clase a las 9:00 p. m. martes y jueves · Viaja sola en</tspan><tspan x="156" dy="26">TransMilenio + alimentador</tspan></text>
<text y="657" font-family="Space Grotesk" font-size="28" font-weight="700" fill="#FFB81C"><tspan x="156" dy="0">“La app me informa, pero no me</tspan><tspan x="156" dy="35">protege.”</tspan></text>
<text y="724" font-family="Space Mono" font-size="14" font-weight="400" fill="#C7D7FB"><tspan x="156" dy="0">PERSONA PRINCIPAL · [E] entrevistas · [S] supuesto</tspan></text>
<rect x="710" y="254" width="1090" height="103" fill="#2160EB" rx="18" ry="18"/>
<text y="290" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="738" dy="0">OBJETIVO</tspan></text>
<text y="325" font-family="Space Grotesk" font-size="21" font-weight="400" fill="#FFFFFF"><tspan x="738" dy="0">Llegar a casa tranquila, sin depender de que la recojan ni de pagar un carro cada noche.</tspan></text>
<rect x="710" y="369" width="1090" height="132" fill="#2160EB" rx="18" ry="18"/>
<text y="405" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="738" dy="0">NECESIDADES</tspan></text>
<text y="440" font-family="Space Grotesk" font-size="21" font-weight="400" fill="#FFFFFF"><tspan x="738" dy="0">Saber quién de su universidad hace su mismo tramo a la misma hora · que su mamá sepa que llegó sin</tspan><tspan x="738" dy="29">escribirle · que la otra persona esté verificada.</tspan></text>
<rect x="710" y="513" width="1090" height="103" fill="#2160EB" rx="18" ry="18"/>
<text y="550" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="738" dy="0">FRUSTRACIONES</tspan></text>
<text y="584" font-family="Space Grotesk" font-size="21" font-weight="400" fill="#FFFFFF"><tspan x="738" dy="0">La app le da horarios, no tranquilidad · compartir la ubicación es manual · no confía en desconocidos.</tspan></text>
<rect x="710" y="628" width="1090" height="103" fill="#2160EB" rx="18" ry="18"/>
<text y="665" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="738" dy="0">MOTIVACIONES</tspan></text>
<text y="699" font-family="Space Grotesk" font-size="21" font-weight="400" fill="#FFFFFF"><tspan x="738" dy="0">No sentirse sola en el momento más expuesto · autonomía · tranquilizar a su mamá.</tspan></text>
<text y="764" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="710" dy="0">RECORRIDO</tspan></text>
