<rect x="408" y="170" width="122" height="52" fill="#FFB81C" rx="26" ry="26"/>
<text y="207" font-family="Space Grotesk" font-size="30" font-weight="700" fill="#0B1B3F"><tspan x="432" dy="0">Must</tspan></text>
<text y="341" font-family="Space Grotesk" font-size="42" font-weight="700" fill="#FFB81C"><tspan x="120" dy="0">Una app para emparejarte con alguien verificado que hace tu mismo</tspan><tspan x="120" dy="50">trayecto de noche.</tspan></text>
<text y="451" font-family="Space Grotesk" font-size="24" font-weight="400" fill="#FFFFFF"><tspan x="120" dy="0">Match de ruta verificado conecta a personas verificadas que hacen el mismo trayecto en transporte público a la misma hora. Para</tspan><tspan x="120" dy="35">entrar, cada persona se verifica con su correo institucional o con dos avales de su círculo cercano. Después guarda su ruta y su</tspan><tspan x="120" dy="35">horario, y la app le muestra quién de su universidad, su trabajo o su círculo sale a esa hora por el mismo tramo. Cuando las dos</tspan><tspan x="120" dy="35">aceptan, se encuentran en el paradero y comparten la ubicación solo mientras dura el trayecto. Al llegar, se apaga sola.</tspan></text>
