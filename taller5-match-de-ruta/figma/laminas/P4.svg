<rect x="120" y="254" width="544" height="478" fill="#2160EB" rx="20" ry="20"/>
<text y="296" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="148" dy="0">NECESIDADES</tspan></text>
<text y="338" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Saber quién de su universidad hace su</tspan><tspan x="148" dy="32">mismo tramo a la misma hora [E: insight 03]</tspan></text>
<text y="411" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Que su mamá sepa que llegó sin tener que</tspan><tspan x="148" dy="32">escribirle [E: insight 04]</tspan></text>
<text y="483" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• No sentirse sola en la espera del</tspan><tspan x="148" dy="32">alimentador [E]</tspan></text>
<text y="556" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Que la otra persona esté verificada y, si lo</tspan><tspan x="148" dy="32">prefiere, sea mujer [E: insight 05]</tspan></text>
<text y="628" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Que nadie sepa su dirección ni su rutina</tspan><tspan x="148" dy="32">completa [S]</tspan></text>
<rect x="688" y="254" width="544" height="478" fill="#2160EB" rx="20" ry="20"/>
<text y="296" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="716" dy="0">CÓMO SE COMPORTA</tspan></text>
<text y="338" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Revisa la app oficial antes de salir, aunque</tspan><tspan x="716" dy="32">no le quita el miedo [E: 5 de 5]</tspan></text>
<text y="411" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Elige dónde esperar por la luz, la cercanía</tspan><tspan x="716" dy="32">y la gente [E: 0 de 5 usa una app]</tspan></text>
<text y="483" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Guarda el celular y se queda alerta cuando</tspan><tspan x="716" dy="32">el paradero se vacía [E]</tspan></text>
<text y="556" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Comparte la ubicación; a veces se le olvida</tspan><tspan x="716" dy="32">apagarla [E/S]</tspan></text>
<text y="628" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Pregunta en el grupo del curso “¿alguien</tspan><tspan x="716" dy="32">va para el sur?”, pero casi nunca coincide</tspan><tspan x="716" dy="32">[S]</tspan></text>
<rect x="1256" y="254" width="544" height="478" fill="#2160EB" rx="20" ry="20"/>
<text y="296" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="1284" dy="0">FRUSTRACIONES</tspan></text>
<text y="338" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• La app le da horarios, no tranquilidad [E]</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Pedir un carro todas las noches no le</tspan><tspan x="1284" dy="32">alcanza [S]</tspan></text>
<text y="451" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Compartir la ubicación es manual y queda</tspan><tspan x="1284" dy="32">activa de más [E/S]</tspan></text>
<text y="523" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• No confía en desconocidos [E: idea</tspan><tspan x="1284" dy="32">descartada]</tspan></text>
<text y="596" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Los grupos de WhatsApp no sirven para</tspan><tspan x="1284" dy="32">coordinar a última hora [S]</tspan></text></svg>