<rect x="120" y="294" width="544" height="478" fill="#2160EB" rx="20" ry="20"/>
<text y="337" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="148" dy="0">NECESIDADES</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Saber quién de su universidad hace su</tspan><tspan x="148" dy="32">mismo tramo a la misma hora [E]</tspan></text>
<text y="452" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Que su mamá sepa que llegó sin tener que</tspan><tspan x="148" dy="32">escribirle [E]</tspan></text>
<text y="524" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• No estar sola mientras espera el</tspan><tspan x="148" dy="32">alimentador [E]</tspan></text>
<text y="596" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Que la otra persona esté verificada y, si lo</tspan><tspan x="148" dy="32">prefiere, sea mujer [E]</tspan></text>
<text y="669" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Que nadie conozca su dirección ni su</tspan><tspan x="148" dy="32">rutina completa [S]</tspan></text>
<rect x="688" y="294" width="544" height="478" fill="#2160EB" rx="20" ry="20"/>
<text y="337" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="716" dy="0">CÓMO SE COMPORTA</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Revisa la app de rutas antes de salir,</tspan><tspan x="716" dy="32">aunque eso no le quita el miedo [E]</tspan></text>
<text y="452" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Elige dónde esperar por la luz, la cercanía</tspan><tspan x="716" dy="32">y la gente, no por una app [E]</tspan></text>
<text y="524" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Guarda el celular y se pone alerta cuando</tspan><tspan x="716" dy="32">el paradero se vacía [E]</tspan></text>
<text y="596" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Comparte la ubicación, pero a veces se le</tspan><tspan x="716" dy="32">olvida apagarla [S]</tspan></text>
<text y="669" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Pregunta en el grupo del curso “¿alguien</tspan><tspan x="716" dy="32">va para el sur?”, pero casi nunca coincide</tspan><tspan x="716" dy="32">[S]</tspan></text>
<rect x="1256" y="294" width="544" height="478" fill="#2160EB" rx="20" ry="20"/>
<text y="337" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="1284" dy="0">FRUSTRACIONES</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• La app le da horarios, pero no tranquilidad</tspan><tspan x="1284" dy="32">[E]</tspan></text>
<text y="452" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• No le alcanza para pedir un carro todas las</tspan><tspan x="1284" dy="32">noches [S]</tspan></text>
<text y="524" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Compartir la ubicación es manual y se</tspan><tspan x="1284" dy="32">queda activa de más [S]</tspan></text>
<text y="596" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• No confía en desconocidos [E]</tspan></text>
<text y="637" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Los grupos de WhatsApp no sirven para</tspan><tspan x="1284" dy="32">coordinar a última hora [S]</tspan></text></svg>