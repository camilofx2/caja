<text y="823" font-family="Space Grotesk" font-size="17" font-weight="400" fill="#C7D7FB"><tspan x="1277" dy="0">Salen del benchmarking y de los riesgos. Propongo el código</tspan><tspan x="1277" dy="24">como Should y el atajo al 123 como Could.</tspan></text></svg>