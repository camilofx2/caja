<text y="196" font-family="Space Grotesk" font-size="76" font-weight="700" fill="#FFFFFF"><tspan x="120" dy="0">Daniela: quién es y su contexto</tspan></text>
<text y="244" font-family="Space Grotesk" font-size="22" font-weight="400" fill="#C7D7FB"><tspan x="120" dy="0">[E] dato de las 5 entrevistas · [S] supuesto para completar el perfil</tspan></text>
