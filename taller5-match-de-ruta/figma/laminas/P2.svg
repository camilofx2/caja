<text y="296" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="148" dy="0">QUIÉN ES</tspan></text>
<text y="338" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Mujer, 22 años, 8.º semestre [S: carrera y</tspan><tspan x="148" dy="32">semestre]</tspan></text>
<text y="411" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Vive con su mamá y su hermano menor en</tspan><tspan x="148" dy="32">Bosa [S]</tspan></text>
<text y="483" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Práctica de medio tiempo en las mañanas;</tspan><tspan x="148" dy="32">clases de 6 a 9 p. m. martes y jueves [S]</tspan></text>
<text y="556" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• No tiene carro ni moto: depende del</tspan><tspan x="148" dy="32">transporte público [E]</tspan></text>
<text y="628" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Celular Android de gama media, plan</tspan><tspan x="148" dy="32">prepago: cuida la batería y los datos [S]</tspan></text>
<rect x="688" y="254" width="544" height="510" fill="#2160EB" rx="20" ry="20"/>
<text y="296" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="716" dy="0">SU CONTEXTO</tspan></text>
<text y="338" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Su trayecto dura cerca de 1 h 40 min: una</tspan><tspan x="716" dy="32">troncal y un alimentador [S]</tspan></text>
<text y="411" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• El tramo más largo lo hace de pie y con el</tspan><tspan x="716" dy="32">celular guardado [S]</tspan></text>
<text y="483" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Espera el alimentador en un paradero con</tspan><tspan x="716" dy="32">poca luz que se va quedando vacío [E: brief]</tspan></text>
<text y="556" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• En su curso hay gente que sale a la misma</tspan><tspan x="716" dy="32">hora, pero no sabe quién va hacia el sur [S]</tspan></text>
<text y="628" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Ya la siguieron una cuadra al bajarse [E:</tspan><tspan x="716" dy="32">“Me persiguieron”]</tspan></text>
<rect x="1256" y="254" width="544" height="510" fill="#2160EB" rx="20" ry="20"/>
<text y="296" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="1284" dy="0">TECNOLOGÍA QUE USA</tspan></text>
<text y="338" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• App oficial del transporte para rutas y</tspan><tspan x="1284" dy="32">horarios (como 5 de 5) [E]</tspan></text>
<text y="411" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Google Maps cuando va a un lugar nuevo</tspan><tspan x="1284" dy="32">(como 2 de 5) [E]</tspan></text>
<text y="483" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Comparte su ubicación en tiempo real con</tspan><tspan x="1284" dy="32">su mamá (como 2 de 5) [E; canal WhatsApp:</tspan><tspan x="1284" dy="32">S]</tspan></text>
<text y="588" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Escucha música cuando hay gente; la</tspan><tspan x="1284" dy="32">apaga y guarda el celular cuando se queda</tspan><tspan x="1284" dy="32">sola [E]</tspan></text>
<text y="692" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Nivel digital alto: no necesita tutoriales, sí</tspan><tspan x="1284" dy="32">reglas claras de privacidad [S]</tspan></text></svg>