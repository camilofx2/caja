<rect x="120" y="294" width="544" height="478" fill="#2160EB" rx="20" ry="20"/>
<text y="337" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="148" dy="0">QUIÉN ES</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• 22 años, 8.º semestre de Comunicación</tspan><tspan x="148" dy="32">Social [S]</tspan></text>
<text y="452" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Vive con su mamá y su hermano menor en</tspan><tspan x="148" dy="32">Bosa [S]</tspan></text>
<text y="524" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Práctica de medio tiempo en las mañanas;</tspan><tspan x="148" dy="32">clases de 6 a 9 p. m. martes y jueves [S]</tspan></text>
<text y="596" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• No tiene carro ni moto: depende del</tspan><tspan x="148" dy="32">transporte público [E]</tspan></text>
<text y="669" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Celular Android de gama media con plan</tspan><tspan x="148" dy="32">prepago: cuida la batería y los datos [S]</tspan></text>
<rect x="688" y="294" width="544" height="478" fill="#2160EB" rx="20" ry="20"/>
<text y="337" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="716" dy="0">SU CONTEXTO</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Su trayecto dura cerca de 1 h 40 min: una</tspan><tspan x="716" dy="32">troncal y un alimentador [S]</tspan></text>
<text y="452" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Hace el tramo más largo de pie y con el</tspan><tspan x="716" dy="32">celular guardado [S]</tspan></text>
<text y="524" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Espera el alimentador en un paradero con</tspan><tspan x="716" dy="32">poca luz que se va quedando vacío [E]</tspan></text>
<text y="596" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• En su curso hay gente que sale a la misma</tspan><tspan x="716" dy="32">hora, pero no sabe quién va hacia el sur [S]</tspan></text>
<text y="669" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Una vez la siguieron al bajarse del bus [E]</tspan></text>
<rect x="1256" y="294" width="544" height="478" fill="#2160EB" rx="20" ry="20"/>
<text y="337" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="1284" dy="0">TECNOLOGÍA QUE USA</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• App de rutas y horarios del transporte,</tspan><tspan x="1284" dy="32">como los 5 entrevistados [E]</tspan></text>
<text y="452" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Google Maps cuando va a un lugar nuevo</tspan><tspan x="1284" dy="32">[E]</tspan></text>
<text y="524" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Comparte su ubicación con su mamá; 2 de</tspan><tspan x="1284" dy="32">5 entrevistados lo hacen siempre [E]</tspan></text>
<text y="596" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Escucha música cuando hay gente;</tspan><tspan x="1284" dy="32">cuando se queda sola, la apaga y guarda el</tspan><tspan x="1284" dy="32">celular [E]</tspan></text>
<text y="701" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Maneja bien el celular; lo que pide son</tspan><tspan x="1284" dy="32">reglas claras de privacidad [S]</tspan></text></svg>