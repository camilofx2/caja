<rect x="120" y="294" width="544" height="518" fill="#2160EB" rx="20" ry="20"/>
<text y="337" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="148" dy="0">MOTIVACIONES</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• No estar sola en el momento en que más</tspan><tspan x="148" dy="32">expuesta se siente [E]</tspan></text>
<text y="452" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Terminar la carrera sin evitar las materias</tspan><tspan x="148" dy="32">de la noche [S]</tspan></text>
<text y="524" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• No depender de que alguien la recoja [S]</tspan></text>
<text y="564" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Que su mamá esté tranquila [E]</tspan></text>
<rect x="688" y="294" width="544" height="518" fill="#2160EB" rx="20" ry="20"/>
<text y="337" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="716" dy="0">MIEDOS</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Violencia sexual: lo mencionaron las 3</tspan><tspan x="716" dy="32">mujeres entrevistadas [E]</tspan></text>
<text y="452" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Que la roben o la agredan en el bus o en el</tspan><tspan x="716" dy="32">paradero [E]</tspan></text>
<text y="524" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Que la sigan al bajarse del bus [E]</tspan></text>
<text y="564" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Que una app muestre su ubicación a quien</tspan><tspan x="716" dy="32">no debe [S]</tspan></text>
<rect x="1256" y="294" width="544" height="518" fill="#2160EB" rx="20" ry="20"/>
<text y="337" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="1284" dy="0">SITUACIONES QUE CAMBIAN SUS DECISIONES</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Si se le hace tarde, cambia de plan: pide</tspan><tspan x="1284" dy="32">un carro o se queda donde una amiga; 4 de</tspan><tspan x="1284" dy="32">5 entrevistados lo han hecho [E]</tspan></text>
<text y="484" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Si llueve, el paradero se vacía más rápido</tspan><tspan x="1284" dy="32">[S]</tspan></text>
<text y="556" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Con menos del 20 % de batería deja de</tspan><tspan x="1284" dy="32">compartir la ubicación [S]</tspan></text>
<text y="629" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Si va con alguien conocido, se queda</tspan><tspan x="1284" dy="32">estudiando hasta tarde [S]</tspan></text>
<text y="701" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• En semana de parciales sale más tarde [S]</tspan></text>
<text y="741" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• A fin de mes revisa si le alcanza para un</tspan><tspan x="1284" dy="32">carro [S]</tspan></text></svg>