<rect x="120" y="254" width="544" height="518" fill="#2160EB" rx="20" ry="20"/>
<text y="296" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="148" dy="0">MOTIVACIONES</tspan></text>
<text y="338" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• No sentirse sola en el momento más</tspan><tspan x="148" dy="32">expuesto [E]</tspan></text>
<text y="411" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Terminar la carrera sin evitar las materias</tspan><tspan x="148" dy="32">de la noche [S]</tspan></text>
<text y="483" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Autonomía: no depender de que alguien la</tspan><tspan x="148" dy="32">recoja [S]</tspan></text>
<text y="556" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="148" dy="0">• Tranquilizar a su mamá [E: la mayoría le</tspan><tspan x="148" dy="32">avisa a alguien]</tspan></text>
<rect x="688" y="254" width="544" height="518" fill="#2160EB" rx="20" ry="20"/>
<text y="296" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="716" dy="0">MIEDOS</tspan></text>
<text y="338" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Violencia sexual (las 3 mujeres) [E]</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Robo y agresión (las 5 personas) [E]</tspan></text>
<text y="419" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Que la sigan al bajarse del bus [E: “Me</tspan><tspan x="716" dy="32">persiguieron”]</tspan></text>
<text y="491" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="716" dy="0">• Que una app exponga su ubicación a</tspan><tspan x="716" dy="32">quien no debe [S: planteado en la retro]</tspan></text>
<rect x="1256" y="254" width="544" height="518" fill="#2160EB" rx="20" ry="20"/>
<text y="296" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C" letter-spacing="0.96"><tspan x="1284" dy="0">SITUACIONES QUE CAMBIAN SUS DECISIONES</tspan></text>
<text y="338" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Después de las 10 p. m. no espera el</tspan><tspan x="1284" dy="32">alimentador: pide un carro o se queda</tspan><tspan x="1284" dy="32">donde una amiga [E: 4 de 5 cambiaron de</tspan><tspan x="1284" dy="32">plan]</tspan></text>
<text y="475" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Si llueve, el paradero se vacía [S]</tspan></text>
<text y="515" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Con menos del 20 % de batería deja de</tspan><tspan x="1284" dy="32">compartir la ubicación [S]</tspan></text>
<text y="588" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• Si va con alguien conocido, se queda</tspan><tspan x="1284" dy="32">hasta tarde [S]</tspan></text>
<text y="660" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• En semana de parciales sale más tarde [S]</tspan></text>
<text y="700" font-family="Space Grotesk" font-size="23" font-weight="400" fill="#FFFFFF"><tspan x="1284" dy="0">• A fin de mes decide si le alcanza para un</tspan><tspan x="1284" dy="32">carro [S]</tspan></text></svg>