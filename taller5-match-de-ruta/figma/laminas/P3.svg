<rect x="120" y="254" width="228" height="212" fill="#2160EB" rx="16" ry="16"/>
<text y="292" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C"><tspan x="136" dy="0">9:00 p. m.</tspan></text>
<text y="327" font-family="Space Grotesk" font-size="21" font-weight="700" fill="#FFFFFF"><tspan x="136" dy="0">Sale de clase</tspan></text>
<text y="354" font-family="Space Grotesk" font-size="15" font-weight="400" fill="#FFFFFF"><tspan x="136" dy="0">Revisa en la app cuándo</tspan><tspan x="136" dy="20">pasa la troncal.</tspan></text>
<rect x="362" y="254" width="228" height="212" fill="#2160EB" rx="16" ry="16"/>
<text y="292" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C"><tspan x="378" dy="0">9:05 p. m.</tspan></text>
<text y="327" font-family="Space Grotesk" font-size="21" font-weight="700" fill="#FFFFFF"><tspan x="378" dy="0">Camina a la</tspan><tspan x="378" dy="25">estación</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="15" font-weight="400" fill="#FFFFFF"><tspan x="378" dy="0">8 minutos por una calle</tspan><tspan x="378" dy="20">con poca luz. Se quita un</tspan><tspan x="378" dy="20">audífono.</tspan></text>
<rect x="604" y="254" width="228" height="212" fill="#2160EB" rx="16" ry="16"/>
<text y="292" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C"><tspan x="620" dy="0">9:15 p. m.</tspan></text>
<text y="327" font-family="Space Grotesk" font-size="21" font-weight="700" fill="#FFFFFF"><tspan x="620" dy="0">Troncal</tspan></text>
<text y="354" font-family="Space Grotesk" font-size="15" font-weight="400" fill="#FFFFFF"><tspan x="620" dy="0">40 minutos de pie. Hay</tspan><tspan x="620" dy="20">gente; guarda el celular en</tspan><tspan x="620" dy="20">la maleta.</tspan></text>
<rect x="846" y="254" width="228" height="212" fill="#2160EB" rx="16" ry="16"/>
<text y="292" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C"><tspan x="862" dy="0">9:55 p. m.</tspan></text>
<text y="327" font-family="Space Grotesk" font-size="21" font-weight="700" fill="#FFFFFF"><tspan x="862" dy="0">Llega al portal</tspan></text>
<text y="354" font-family="Space Grotesk" font-size="15" font-weight="400" fill="#FFFFFF"><tspan x="862" dy="0">Busca el paradero del</tspan><tspan x="862" dy="20">alimentador; cada vez hay</tspan><tspan x="862" dy="20">menos gente.</tspan></text>
<rect x="1088" y="254" width="228" height="212" fill="#FFB81C" rx="16" ry="16"/>
<text y="292" font-family="Space Mono" font-size="16" font-weight="700" fill="#0B1B3F"><tspan x="1104" dy="0">10:00 p. m.</tspan></text>
<text y="327" font-family="Space Grotesk" font-size="21" font-weight="700" fill="#0B1B3F"><tspan x="1104" dy="0">Espera el</tspan><tspan x="1104" dy="25">alimentador</tspan></text>
<text y="379" font-family="Space Grotesk" font-size="15" font-weight="400" fill="#0B1B3F"><tspan x="1104" dy="0">De 10 a 20 min sin saber</tspan><tspan x="1104" dy="20">cuánto tarda. Se para</tspan><tspan x="1104" dy="20">cerca de la luz y de otras</tspan><tspan x="1104" dy="20">personas.</tspan></text>
<rect x="1330" y="254" width="228" height="212" fill="#FFB81C" rx="16" ry="16"/>
<text y="292" font-family="Space Mono" font-size="16" font-weight="700" fill="#0B1B3F"><tspan x="1346" dy="0">10:30 p. m.</tspan></text>
<text y="327" font-family="Space Grotesk" font-size="21" font-weight="700" fill="#0B1B3F"><tspan x="1346" dy="0">Camina a casa</tspan></text>
<text y="354" font-family="Space Grotesk" font-size="15" font-weight="400" fill="#0B1B3F"><tspan x="1346" dy="0">6 minutos a pie. Mira hacia</tspan><tspan x="1346" dy="20">atrás varias veces.</tspan></text>
<rect x="1572" y="254" width="228" height="212" fill="#2160EB" rx="16" ry="16"/>
<text y="292" font-family="Space Mono" font-size="16" font-weight="700" fill="#FFB81C"><tspan x="1588" dy="0">10:40 p. m.</tspan></text>
<text y="327" font-family="Space Grotesk" font-size="21" font-weight="700" fill="#FFFFFF"><tspan x="1588" dy="0">Llega a casa</tspan></text>
<text y="354" font-family="Space Grotesk" font-size="15" font-weight="400" fill="#FFFFFF"><tspan x="1588" dy="0">Le escribe “llegué” a su</tspan><tspan x="1588" dy="20">mamá y apaga la ubicación</tspan><tspan x="1588" dy="20">(si se acuerda).</tspan></text>
