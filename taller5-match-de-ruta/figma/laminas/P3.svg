<text y="641" font-family="Space Grotesk" font-size="16" font-weight="700" fill="#FFFFFF"><tspan x="1702" dy="0">Alivio</tspan></text>
<text y="730" font-family="Space Grotesk" font-size="22" font-weight="700" fill="#FFB81C"><tspan x="120" dy="0">→ El momento más expuesto no es el bus: es la espera del alimentador y la caminata final. Ahí actúa Match.</tspan></text></svg>