*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.app{padding-top:calc(12px + env(safe-area-inset-top,0px))!important}
@media (min-width:960px){.app{padding-top:calc(24px + env(safe-area-inset-top,0px))!important}.nav{padding-top:calc(28px + env(safe-area-inset-top,0px))!important}}
.login{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px 16px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.login-card{width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--line);border-radius:26px;padding:28px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:0 30px 80px -30px rgba(47,91,255,.5);animation:rise .6s cubic-bezier(.16,.9,.3,1) both}
.login-card .logo{width:96px;margin-bottom:6px}
.login-card h1{margin:0;font-size:24px;letter-spacing:-.03em}
.login-card p{margin:0 0 12px}
#login-msg{font-size:13.5px;min-height:1em;margin:4px 0 0}
#login-msg.err{color:var(--danger)}
html,body{background:var(--bg)}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;will-change:transform}
.bgfx .b1{width:95vmax;height:95vmax;left:-35vmax;top:-45vmax;background:radial-gradient(circle,var(--glow1) 0%,transparent 62%);animation:drift1 34s ease-in-out infinite alternate}
.bgfx .b2{width:85vmax;height:85vmax;right:-40vmax;bottom:-45vmax;background:radial-gradient(circle,var(--glow2) 0%,transparent 62%);animation:drift2 42s ease-in-out infinite alternate}
.bgfx .b3{width:60vmax;height:60vmax;left:30%;top:35%;background:radial-gradient(circle,var(--glow3) 0%,transparent 65%);animation:drift3 55s ease-in-out infinite alternate}
.bgfx::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,color-mix(in srgb,var(--bg) 55%,transparent) 100%)}
@keyframes drift1{to{transform:translate(12vmax,9vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-10vmax,-12vmax) scale(1.08)}}
@keyframes drift3{to{transform:translate(-18vmax,-8vmax) scale(1.25)}}
.shell{position:relative;z-index:1}
.logo{display:block;background:var(--logo) center/contain no-repeat;filter:var(--logo-filter);aspect-ratio:525/435}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:18px;height:18px}

/* layout */
.app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:center;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-top:1px solid var(--line)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:12px;min-width:58px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"] .ico{stroke:var(--accent)}
.nav a{flex:1;min-width:0!important;padding:6px 2px!important;font-size:10.5px!important;position:relative}
.nav a .ico{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.nav a[aria-current="page"] .ico{transform:translateY(-2px)}
.nav a[aria-current="page"]::after{content:"";position:absolute;bottom:0;left:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%);box-shadow:0 0 8px var(--accent)}
.dock{display:flex;gap:5px;padding:5px;border-radius:22px;margin-top:-30px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 40px -12px rgba(47,91,255,.55);flex:none}
.gbtn{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-weight:600;isolation:isolate;transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .25s}
.gbtn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.gbtn:hover::before{transform:translateX(120%)}
.gbtn:active{transform:scale(.93)}
.g-out{background:linear-gradient(150deg,#4A70FF 0%,#1C3BD0 45%,#0A1558 100%);box-shadow:0 8px 22px -8px rgba(47,91,255,.9),inset 0 1px 0 rgba(255,255,255,.25)}
.g-mid{background:linear-gradient(150deg,#39405A 0%,#1A1E2B 55%,#0B0D14 100%);box-shadow:0 8px 20px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.18)}
.g-in{background:linear-gradient(150deg,#B7C9FF 0%,#6F93FF 40%,#2F5BFF 100%);box-shadow:0 8px 22px -8px rgba(111,147,255,.9),inset 0 1px 0 rgba(255,255,255,.45)}
.dock .gbtn{width:52px;height:50px;border-radius:17px;font-size:9.5px;letter-spacing:.01em}
.dock .gbtn .ico{width:19px;height:19px;stroke-width:2.2}
.nav .desk-only{display:none}
.brand{display:none}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:230px 1fr;gap:28px;max-width:1300px;margin:0 auto;padding-inline:20px}
  .app{padding-inline:0;padding-block:24px 60px;max-width:none}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;border-top:0;border-right:1px solid var(--line);padding:28px 16px 20px 0;background:transparent;backdrop-filter:none}
  .nav a{flex-direction:row;font-size:14.5px;gap:12px;padding:10px 12px;min-width:0}
  .nav a[aria-current="page"]{background:var(--surface)}
  .nav a{flex:none;font-size:14.5px!important;padding:10px 12px!important}
  .nav a[aria-current="page"]::after{left:auto;right:12px;top:50%;bottom:auto;transform:translateY(-50%)}
  .dock{order:-1;margin:0 0 20px;width:100%;background:transparent;border:0;padding:0;box-shadow:none;backdrop-filter:none;gap:8px}
  .dock .gbtn{flex:1;height:64px;border-radius:16px;font-size:12px;gap:5px}
  .dock .gbtn .ico{width:21px;height:21px}
  .nav .desk-only{display:flex}
  .brand{display:flex;order:-2;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.03em;margin:0 0 22px 12px}
}
.brand .logo{width:78px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:26px;letter-spacing:-.035em;margin:0;font-weight:650;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.top-actions{display:flex;gap:8px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--ink)}
.iconbtn:hover{background:var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--surface);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pill.warn i{background:var(--danger)}

/* grid */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
@media (min-width:1180px){.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.three .span2{grid-column:span 2}}
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:var(--r);padding:18px;min-width:0}
.card h3{margin:0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .link{color:var(--accent);font-weight:500;font-size:13px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.big{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.mid{font-size:20px;font-weight:600;letter-spacing:-.03em}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:22px 20px 0;isolation:isolate;border:1px solid var(--hero-line)}
.orb{position:absolute;border-radius:50%;filter:blur(48px);z-index:-1;opacity:.75}
.orb.a{width:260px;height:260px;background:#2F5BFF;top:-120px;right:-60px;animation:float 14s ease-in-out infinite}
.orb.b{width:200px;height:200px;background:#7C9BFF;bottom:-120px;left:-40px;opacity:.35;animation:float 18s ease-in-out infinite reverse}
.orb.c{width:140px;height:140px;background:#1238C9;top:30%;left:45%;opacity:.4;animation:float 22s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,20px) scale(1.15)}}
.hero .label{font-size:12.5px;color:var(--hero-muted);letter-spacing:.04em;text-transform:uppercase}
.hero .big{font-size:38px;margin:6px 0 4px;color:#fff}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--hero-muted)}
.hero-stats b{display:block;color:#fff;font-weight:500;font-size:14.5px}
.hero .chart{margin:10px -20px 0;--c-line:#7C9BFF;--c-line2:#FFFFFF}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:#fff}

/* chart */
.chart{position:relative;touch-action:pan-y;--c-line:var(--accent);--c-line2:var(--accent2)}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.anim .chart svg{animation:reveal 1.3s cubic-bezier(.2,.7,.2,1) both}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.c-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--c-line2);transform:translate(-50%,-50%);box-shadow:0 0 0 4px color-mix(in srgb,var(--c-line) 35%,transparent),0 0 18px var(--c-line);pointer-events:none}
.c-tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11.5px;padding:4px 8px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;font-family:var(--mono)}
.hero .c-tip{background:#fff;color:#000}
.c-rule{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--c-line) 50%,transparent);pointer-events:none;opacity:0}

.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.bars .pair{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.bars .bar{width:min(14px,40%);border-radius:6px 6px 3px 3px;transform-origin:bottom;position:relative}
.anim .bars .bar{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.bar.in{background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 6px 18px -6px var(--accent)}
.bar.out{background:linear-gradient(180deg,var(--ink2),var(--ink))}
.bars .m{font-size:11px;color:var(--muted)}
.bars .col.cur .m{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px;vertical-align:1px}

.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .center b{font-size:17px;font-weight:600;letter-spacing:-.03em}
.donut .center span{font-size:11px;color:var(--muted)}
.anim .donut circle.seg{animation:dash 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes dash{from{stroke-dasharray:0 1000}}
.cat-list{flex:1;min-width:180px;display:flex;flex-direction:column;gap:9px}
.cat-row{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.cat-row i{width:10px;height:10px;border-radius:3px}
.cat-row .p{color:var(--muted);font-size:12px;margin-left:6px}

/* today */
.today{display:flex;flex-direction:column;gap:12px}
.meter{height:10px;border-radius:99px;background:var(--surface);overflow:hidden;position:relative}
.meter>span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.meter.over>span{background:linear-gradient(90deg,#ff9d94,var(--danger))}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{padding:14px 6px;border-radius:16px;font-size:13px;gap:6px}
.qbtn .ico{width:21px;height:21px;stroke-width:2.1}

/* where money */
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px;margin:6px 0 14px}
.stack span{display:block;height:100%;border-radius:3px}
.anim .stack span{animation:growx 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes growx{from{transform:scaleX(0)}}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{text-align:right;font-weight:500;white-space:nowrap}
.row .v small{display:block;color:var(--muted);font-weight:400;font-size:12px}
button.row{width:100%;text-align:left}
button.row:hover .t b{color:var(--accent)}
.mono{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;background:var(--surface);color:var(--ink2);letter-spacing:-.02em}
.mono.in{background:var(--accent-soft);color:var(--accent)}
.mono.acc{background:var(--ink);color:var(--bg)}
.pos{color:var(--accent)}
.neg{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.chip.red{background:var(--danger-soft);color:var(--danger)}
.chip.dark{background:var(--ink);color:var(--bg)}

/* tips */
.tip{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tip:first-of-type{border-top:0}
.tip .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface)}
.tip.good .dot{background:var(--accent-soft);color:var(--accent)}
.tip.warn .dot{background:var(--danger-soft);color:var(--danger)}
.tip b{font-weight:600;font-size:14px;display:block}
.tip p{margin:2px 0 0;color:var(--muted);font-size:13.5px;max-width:62ch}

/* movimientos */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.monthbar .mname{font-weight:600;font-size:17px;letter-spacing:-.02em;text-transform:capitalize}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sumrow div{background:var(--surface);border-radius:14px;padding:12px}
.sumrow small{display:block;color:var(--muted);font-size:12px}
.sumrow b{font-size:15.5px;font-weight:600}
.dayhead{font-size:12.5px;color:var(--muted);padding:16px 0 4px;display:flex;justify-content:space-between;text-transform:capitalize}
.search{display:flex;gap:8px;margin:14px 0 4px}
.search input,.search select{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px}
.search select{flex:0 0 auto;max-width:44%}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* seg */
.seg{display:flex;background:var(--surface);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--line2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--line2)}}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dn{font-size:11px;color:var(--muted);padding-bottom:4px}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;position:relative;gap:3px}
.cal .d.today{background:var(--ink);color:var(--bg);font-weight:600}
.cal .d.past{color:var(--muted)}
.cal .d .dots{display:flex;gap:2px;height:5px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--ink)}
.cal .d .dots i.in{background:var(--accent)}
.cal .d .dots i.late{background:var(--danger)}
.cal .d.today .dots i{background:var(--bg)}
.cal .d.today .dots i.in{background:var(--accent2)}

/* goals */
.goal{display:flex;gap:14px;align-items:center}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:600}
.anim .ring circle.fg{animation:dash 1.2s cubic-bezier(.2,.7,.2,1) both}
.goal .t{flex:1;min-width:0}
.goal .t b{font-weight:600;font-size:15px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{height:40px;padding:0 16px;border-radius:12px;background:var(--surface);font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.88}
.btn.blue{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger);background:var(--danger-soft)}
.btn.block{width:100%;height:50px;font-size:15.5px;border-radius:15px}
.progress{height:6px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.progress.ink span{background:linear-gradient(90deg,var(--ink2),var(--ink))}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.kv div{font-size:12px;color:var(--muted)}
.kv b{display:block;color:var(--ink);font-size:14.5px;font-weight:600}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.banner b{color:var(--accent)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(5,6,10,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;opacity:0;transition:opacity .25s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--sheet);border-radius:24px 24px 0 0;max-height:92%;overflow:auto;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .45s cubic-bezier(.22,1.12,.36,1);border-top:1px solid var(--line)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-size:20px;letter-spacing:-.03em;display:flex;justify-content:space-between;align-items:center}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:480px;border-radius:24px;transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .25s,opacity .25s;max-height:88vh;border:1px solid var(--line)}
  .sheet.show{transform:translate(-50%,-50%);opacity:1}
  .sheet .grab{display:none}
}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface);padding:0 14px;width:100%;font-size:16px}
.field textarea{height:auto;padding:12px 14px;min-height:70px}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:var(--card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:10px 0 4px}
.amount span{font-size:30px;color:var(--muted);font-weight:500}
.amount input{border:0;background:transparent;font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.04em;width:100%;max-width:320px;text-align:center;outline:none;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 12px;border-radius:99px;background:var(--surface);font-size:13px;border:1px solid transparent}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--surface);border-radius:13px;font-size:14px}
.toggle small{display:block;color:var(--muted);font-size:12.5px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
.confirm{background:var(--danger-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;opacity:0;transition:all .3s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){.toast{bottom:28px}}
.steps{margin:0;padding-left:20px;color:var(--ink2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px;letter-spacing:.02em}
.anim .top{animation:fadein .5s ease both}
.anim .grid>*{animation:rise .7s cubic-bezier(.16,.9,.3,1) both}
.anim .grid>*:nth-child(2){animation-delay:.06s}.anim .grid>*:nth-child(3){animation-delay:.12s}.anim .grid>*:nth-child(4){animation-delay:.18s}
.anim .grid>*:nth-child(5){animation-delay:.24s}.anim .grid>*:nth-child(6){animation-delay:.3s}.anim .grid>*:nth-child(7){animation-delay:.36s}
.anim .grid>*:nth-child(8){animation-delay:.42s}.anim .grid>*:nth-child(n+9){animation-delay:.48s}
.anim .banner{animation:rise .6s cubic-bezier(.16,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}}
.btn,.iconbtn,.qbtn,.chips button,.seg button{transition:transform .18s cubic-bezier(.3,1.5,.5,1),background .2s,color .2s}
.btn:active,.iconbtn:active,.chips button:active,.seg button:active,button.row:active{transform:scale(.96)}
button.row{transition:background .2s;border-radius:12px}
.card{transition:border-color .3s,transform .3s}
@media (hover:hover){.card:hover{border-color:var(--line2)}}
.anim .progress span,.anim .dbar span{animation:growx 1.1s cubic-bezier(.2,.8,.2,1) both}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.06) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 7s ease-in-out 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-100%)}40%,100%{transform:translateX(100%)}}
.hero .wm{position:absolute;right:-6px;top:10px;width:120px;opacity:.14;filter:none;z-index:-1}
.head-logo{width:46px;flex:none}
.hello{display:flex;align-items:center;gap:12px}
.dbar{display:block;height:8px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:7px}
.dbar span{display:block;height:100%;border-radius:99px;transform-origin:left;background:linear-gradient(90deg,#0A1558,#2F5BFF 60%,#9DB5FF)}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.bal div{background:var(--surface);border-radius:14px;padding:11px 12px;min-width:0}
.bal small{display:block;color:var(--muted);font-size:12px}
.bal b{font-size:15px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px}
.vs .l{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.vs .track{height:14px;border-radius:6px;background:var(--surface);overflow:hidden}
.vs .track span{display:block;height:100%;border-radius:6px;transform-origin:left}
.anim .vs .track span{animation:growx 1.1s cubic-bezier(.2,.8,.2,1) both}
.boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.box{background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.box .ring{width:52px;height:52px}
.box b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.box small{color:var(--muted);font-size:12px}
.linkbtn{color:var(--accent);font-size:13px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:2px}
.linkbtn .ico{width:15px;height:15px}
.mb{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.mb{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.pvr{display:flex;flex-direction:column;gap:12px}
.pvr .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:6px}
.pvr .h b{color:var(--ink);font-weight:600}
.pvr .meter{height:8px}
.pvr .meter.in>span{background:linear-gradient(90deg,#B7C9FF,#2F5BFF)}
.pvr .meter.ink>span{background:linear-gradient(90deg,var(--ink2),var(--ink))}
.proj{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;isolation:isolate}
.proj::before{content:"";position:absolute;width:180px;height:180px;right:-60px;top:-80px;border-radius:50%;background:radial-gradient(circle,var(--glow1),transparent 70%);z-index:-1}
.proj.bad::before{background:radial-gradient(circle,rgba(217,63,52,.25),transparent 70%)}
.proj small{color:var(--muted);font-size:12.5px}
.ledger{display:flex;flex-direction:column;gap:7px;margin-top:10px;font-size:13.5px}
.ledger div{display:flex;justify-content:space-between;gap:10px}
.ledger div span:first-child{color:var(--muted)}
.ledger .tot{border-top:1px solid var(--line2);padding-top:8px;font-weight:600}
.dist{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin:12px 0 10px}
.dist span{display:block;height:100%;transform-origin:left}
.anim .dist span{animation:growx 1s cubic-bezier(.2,.8,.2,1) both}
.dleg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:12.5px}
.dleg div{display:flex;align-items:center;gap:7px;min-width:0}
.dleg i{width:9px;height:9px;border-radius:3px;flex:none}
.dleg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--ink2)}
.brow .t{background:none;text-align:left;cursor:pointer;padding:0}
.brow .t:hover b{color:var(--accent)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:#fff;transition:all .25s cubic-bezier(.3,1.5,.5,1)}
.chk:hover{border-color:var(--accent)}
.chk.on{border-color:transparent;background:linear-gradient(145deg,#6F93FF,#1C3BD0);box-shadow:0 4px 14px -4px var(--accent)}
.chk.skip{border-style:dashed}
.chk .ico{width:16px;height:16px;stroke-width:2.6}
.grp{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin:16px 0 2px;display:flex;justify-content:space-between}
.grp:first-child{margin-top:4px}
.hist{display:flex;align-items:center;gap:8px;height:130px;position:relative;margin-top:10px}
.hist .c{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;min-width:0}
.hist .up,.hist .dn{flex:1;width:100%;display:flex;justify-content:center}
.hist .up{align-items:flex-end}.hist .dn{align-items:flex-start}
.hist .b{width:min(22px,60%);border-radius:6px}
.hist .up .b{background:linear-gradient(180deg,#9DB5FF,#2F5BFF);transform-origin:bottom}
.hist .dn .b{background:linear-gradient(180deg,var(--danger),#ff9d94);transform-origin:top}
.anim .hist .b{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.hist .zero{position:absolute;left:0;right:0;top:calc(50% - 9px);border-top:1px dashed var(--line2)}
.hist .m{font-size:11px;color:var(--muted);height:18px;line-height:18px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="bgfx" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Secciones">
    <div class="brand"><span class="logo" role="img" aria-label="Firma"></span></div>
    <a href="#inicio" data-view="inicio"><svg class="ico" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="#movimientos" data-view="movimientos"><svg class="ico" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Historial</a>
    <div class="dock" role="group" aria-label="Registrar">
      <button class="gbtn g-out" data-act="newTx" data-type="expense" aria-label="Registrar gasto"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>Gasto</button>
      <button class="gbtn g-mid" data-act="newTx" data-type="transfer" aria-label="Transferir entre cuentas"><svg class="ico" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>Transferir</button>
      <button class="gbtn g-in" data-act="newTx" data-type="income" aria-label="Registrar ingreso"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Ingreso</button>
    </div>
    <a href="#pagos" data-view="pagos"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Pagos</a>
    <a href="#metas" data-view="metas"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Metas</a>
    <a href="#cuentas" data-view="cuentas" class="desk-only"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M16 13h2M3 10h18M6 6V4.5h11V6"/></svg>Cuentas</a>
    <a href="#base" data-view="base" class="desk-only"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Mes base</a>
    <a href="#consejos" data-view="consejos" class="desk-only"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Consejos</a>
  </nav>
  <main class="app" id="view"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="login" id="login" hidden>
  <div class="login-card">
    <span class="logo" role="img" aria-label="Firma"></span>
    <h1>Caja</h1>
    <p class="muted">Entra con tu cuenta para tener los mismos datos en tu iPhone y en tu Mac.</p>
    <form class="form" id="loginform">

<script>
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};

const shiftMonth=(k,n)=>{let[y,m]=k.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)};
const money=n=>(n<0?'−':'')+'$'+Math.round(Math.abs(n)).toLocaleString('es-CO');
const moneyS=n=>{const a=Math.abs(n),s=n<0?'−':'';if(a>=1e6)return s+'$'+(a/1e6).toFixed(a>=1e7?0:1).replace('.',',').replace(',0','')+' M';if(a>=1e3)return s+'$'+Math.round(a/1e3)+' mil';return s+'$'+Math.round(a)};

const ICON={
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',down:'<path d="M12 5v14M19 12l-7 7-7-7"/>',swap:'<path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
  gear:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',alert:'<path d="M12 8v5M12 16.5v.01M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  wallet:'<rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M16 13h2M3 10h18M6 6V4.5h11V6"/>',
  repeat:'<path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',

/* ---------- categorías ---------- */
const CATS={

    {id:'comida',n:'Comida',g:'want'},{id:'mercado',n:'Mercado',g:'need'},{id:'transporte',n:'Transporte',g:'need'},

const initials=s=>{const w=String(s).replace(/[^\p{L}\p{N} ]/gu,'').trim().split(/\s+/);return((w[0]||'?')[0]+(w[1]?w[1][0]:(w[0]||'')[1]||'')).toUpperCase()};

/* ---------- estado ---------- */
let S=null;     // cuentas, programados, metas, deudas, ajustes

function emptyState(){return{v:1,settings:{name:'',sample:false,created:TODAY()},

function ensureBase(){if(S&&!S.budget){S.budget=baseDefault();return true}if(S&&S.budget&&!S.budget.skip)S.budget.skip={};return false}

/* ---------- sincronización (Supabase) ---------- */
const LS='caja.finanzas.v1';
let sb=null;
const Sync={pending:new Set(),timer:null,status:'local',uid:null,email:'',started:false,
  loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j&&j.S){S=j.S;TX=j.TX||{}}}catch(e){}},
  saveLocal(){try{localStorage.setItem(LS,JSON.stringify({S,TX}))}catch(e){}},
  mark(...ids){ids.forEach(i=>this.pending.add(i));this.saveLocal();clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),450)},
  async flush(){
    if(!sb||!this.uid||!this.pending.size)return;
    const ids=[...this.pending];this.pending.clear();const now=new Date().toISOString();
    const rows=ids.map(id=>({user_id:this.uid,id,body:id==='state'?clone(S):{items:clone(TX[id.slice(3)]||[])},updated_at:now}));
    const{error}=await sb.from('caja_docs').upsert(rows);
    if(error){ids.forEach(i=>this.pending.add(i));setSync('error');clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),15000);return}
    if(!this.pending.size)setSync('synced');
  },
  apply(rows,first){
    if(!rows.length){if(first&&S)this.mark('state',...Object.keys(TX).map(k=>'tx-'+k));return}
    const st=rows.find(r=>r.id==='state');if(st&&!this.pending.has('state'))S=st.body;
    const rt={};rows.forEach(r=>{if(r.id.startsWith('tx-'))rt[r.id.slice(3)]=(r.body&&r.body.items)||[]});
    for(const k of Object.keys(TX))if(this.pending.has('tx-'+k))rt[k]=TX[k];
    TX=rt;if(!S)S=emptyState();this.saveLocal();
  },
  async pull(first){
    const{data,error}=await sb.from('caja_docs').select('id,body');
    if(error){setSync('error');return}
    this.apply(data||[],first);if(!this.pending.size)setSync('synced');runAutomations();render();
  },
  applyOne(row){if(!row||!row.id||this.pending.has(row.id))return;
    if(row.id==='state')S=row.body;else if(row.id.startsWith('tx-'))TX[row.id.slice(3)]=(row.body&&row.body.items)||[];
    this.saveLocal();render()},
  async start(user){
    this.uid=user.id;this.email=user.email||'';hideLogin();setSync('connecting');
    try{localStorage.removeItem('caja.localOnly')}catch(e){}
    await this.pull(true);
    if(this.started)return;this.started=true;
    sb.channel('caja-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'caja_docs',filter:'user_id=eq.'+user.id},p=>this.applyOne(p.new)).subscribe();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){this.flush();this.pull(false)}});
    addEventListener('online',()=>{this.flush();this.pull(false)});
  },
  configured(){const c=window.CAJA_CONFIG||{};return !!(c.url&&c.anonKey&&!/PEGA_AQUI/.test(c.url+c.anonKey)&&window.supabase)},
  async connect(){
    if(!this.configured()){setSync('local');return}
    const c=window.CAJA_CONFIG;
    sb=supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const{data}=await sb.auth.getSession();
    if(data&&data.session)return this.start(data.session.user);
    let localOnly=false;try{localOnly=localStorage.getItem('caja.localOnly')==='1'}catch(e){}
    if(!localOnly)showLogin();
  }
};
function setSync(s){Sync.status=s;const p=$('#syncpill');if(p)p.outerHTML=syncPill()}
function syncPill(){
  const m={synced:['ok','Sincronizado'],connecting:['','Conectando…'],error:['warn','Sin conexión'],local:['','Solo este dispositivo']}[Sync.status]||['','—'];
  return `<span class="pill ${m[0]}" id="syncpill" title="Estado de sincronización"><i></i>${m[1]}</span>`;
}
/* inicio de sesión */
let signUpMode=false;
function showLogin(){$('#login').hidden=false;setTimeout(()=>$('#l-email').focus(),100)}
function hideLogin(){$('#login').hidden=true}
function loginMsg(t,err){const m=$('#l-msg');m.textContent=t;m.classList.toggle('err',!!err)}
$('#l-mode').addEventListener('click',()=>{signUpMode=!signUpMode;$('#l-go').textContent=signUpMode?'Crear cuenta':'Entrar';$('#l-mode').textContent=signUpMode?'Ya tengo cuenta':'Crear cuenta nueva';$('#l-pass').autocomplete=signUpMode?'new-password':'current-password';loginMsg('')});
$('#l-local').addEventListener('click',()=>{try{localStorage.setItem('caja.localOnly','1')}catch(e){}hideLogin();setSync('local')});
$('#loginform').addEventListener('submit',async e=>{e.preventDefault();if(!sb)return;
  const email=$('#l-email').value.trim(),password=$('#l-pass').value;$('#l-go').disabled=true;loginMsg(signUpMode?'Creando cuenta…':'Entrando…');
  try{
    if(signUpMode){const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
      if(data.session)await Sync.start(data.user);else{loginMsg('Listo. Te enviamos un correo: confírmalo y luego entra aquí con tu contraseña.');signUpMode=true;$('#l-mode').click()}}
    else{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await Sync.start(data.user)}
  }catch(err){const m=String(err&&err.message||'');loginMsg(/invalid login/i.test(m)?'Correo o contraseña incorrectos.':/not confirmed/i.test(m)?'Primero confirma tu correo con el enlace que te enviamos.':/already registered/i.test(m)?'Ese correo ya tiene cuenta. Toca “Ya tengo cuenta”.':/fetch|network/i.test(m)?'No hay conexión con el servidor. Revisa tu internet o el archivo config.js.':'No se pudo: '+m,true)}
  finally{$('#l-go').disabled=false}});

/* ---------- datos de ejemplo ---------- */
function seedSample(){
  S=emptyState();S.settings.sample=true;
  const t=TODAY(),tk=mkey(t);
  const A={b:nid(),n:nid(),c:nid(),t:nid()};
  S.accounts=[{id:A.b,name:'Bancolombia',type:'bank',initial:1650000},{id:A.n,name:'Nequi',type:'wallet',initial:120000},
    {id:A.c,name:'Efectivo',type:'cash',initial:60000},{id:A.t,name:'Tarjeta Visa',type:'card',initial:-180000,limit:3000000}];
  const dMoto=nid(),dCel=nid();
  S.debts=[{id:dMoto,name:'Crédito moto',entity:'Banco de Bogotá',original:8500000,balance:5230000,rate:24,payment:420000},
           {id:dCel,name:'Celular a cuotas',entity:'Claro',original:1200000,balance:600000,rate:0,payment:100000}];
  S.goals=[{id:nid(),name:'Fondo de emergencia',target:6000000,saved:1850000,deadline:''},
           {id:nid(),name:'Llantas de la moto',target:480000,saved:210000,deadline:addDays(t,75)},
           {id:nid(),name:'Viaje de diciembre',target:2000000,saved:650000,deadline:shiftMonth(tk,3)+'-15'}];
  const nextDay=(day)=>{const d=pd(t);let y=d.getFullYear(),m=d.getMonth()+1;if(d.getDate()>=day){m++;if(m>12){m=1;y++}}return iso(new Date(y,m-1,Math.min(day,dim(y,m))))};
  S.recurring=[
    {id:nid(),name:'Salario',kind:'income',amount:3800000,freq:'monthly',day:30,next:nextDay(30),accountId:A.b,category:'salario',auto:true,active:true},
    {id:nid(),name:'Arriendo',kind:'expense',amount:1100000,freq:'monthly',day:5,next:nextDay(5),accountId:A.b,category:'hogar',auto:false,active:true},
    {id:nid(),name:'Plan celular',kind:'expense',amount:55000,freq:'monthly',day:12,next:nextDay(12),accountId:A.n,category:'celular',auto:false,active:true},
    {id:nid(),name:'Netflix',kind:'expense',amount:38900,freq:'monthly',day:20,next:nextDay(20),accountId:A.t,category:'suscripciones',auto:true,active:true},
    {id:nid(),name:'Spotify',kind:'expense',amount:17900,freq:'monthly',day:27,next:nextDay(27),accountId:A.t,category:'suscripciones',auto:true,active:true},
    {id:nid(),name:'Cuota crédito moto',kind:'expense',amount:420000,freq:'monthly',day:15,next:nextDay(15),accountId:A.b,category:'creditos',auto:false,active:true,debtId:dMoto},
    {id:nid(),name:'Cuota celular',kind:'expense',amount:100000,freq:'monthly',day:8,next:nextDay(8),accountId:A.n,category:'creditos',auto:true,active:true,debtId:dCel},
  ];
  // historia de 3 meses con un generador determinístico
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  TX={};const push=tx=>{const k=mkey(tx.date);(TX[k]=TX[k]||[]).push({id:nid(),...tx})};
  const start=addDays(t,-95);
  for(let d=start;d<=t;d=addDays(d,1)){
    const dd=pd(d),day=dd.getDate(),last=dim(dd.getFullYear(),dd.getMonth()+1);
    if(day===Math.min(30,last)&&d<t)push({date:d,type:'income',amount:3800000,accountId:A.b,category:'salario',note:'Salario'});
    if(day===5)push({date:d,type:'expense',amount:1100000,accountId:A.b,category:'hogar',note:'Arriendo'});
    if(day===12)push({date:d,type:'expense',amount:55000,accountId:A.n,category:'celular',note:'Plan celular'});
    if(day===20)push({date:d,type:'expense',amount:38900,accountId:A.t,category:'suscripciones',note:'Netflix'});
    if(day===15)push({date:d,type:'debt',amount:420000,capital:320000,interest:100000,accountId:A.b,category:'creditos',note:'Cuota crédito moto',debtId:dMoto});
    if(day===8)push({date:d,type:'debt',amount:100000,capital:100000,interest:0,accountId:A.n,category:'creditos',note:'Cuota celular',debtId:dCel});
    if(day===10||day===25)push({date:d,type:'expense',amount:180000+Math.round(rnd()*120)*1000,accountId:A.b,category:'mercado',note:'Mercado D1 / Éxito'});
    if(rnd()<.75)push({date:d,type:'expense',amount:(8+Math.round(rnd()*24))*1000,accountId:rnd()<.5?A.n:A.c,category:'comida',note:['Almuerzo','Café','Domicilio','Empanadas'][Math.floor(rnd()*4)]});

    if(rnd()<.12)push({date:d,type:'expense',amount:(40+Math.round(rnd()*110))*1000,accountId:A.t,category:'ocio',note:['Cine','Salida con amigos','Concierto'][Math.floor(rnd()*3)]});
    if(rnd()<.05)push({date:d,type:'income',amount:(150+Math.round(rnd()*450))*1000,accountId:A.n,category:'freelance',note:'Trabajo freelance'});
    if(day===1)push({date:d,type:'goal_in',amount:250000,accountId:A.b,category:'ahorro',note:'Aporte · Fondo de emergencia',goalId:S.goals[0].id});
    if(day===18)push({date:d,type:'transfer',amount:200000,accountId:A.b,toAccountId:A.t,note:'Pago tarjeta'});
  }
  // cuadrar saldos iniciales para que el saldo actual sea realista
  const target={[A.b]:2480000,[A.n]:215000,[A.c]:95000,[A.t]:-320000};
  for(const a of S.accounts){a.initial=0;a.initial=target[a.id]-accBalance(a.id)}
}

/* ---------- cálculo ---------- */
const allTx=()=>Object.values(TX).flat();
function findTx(id){for(const k in TX){const t=TX[k].find(x=>x.id===id);if(t)return t}return null}
function effect(tx,accId){
  const a=tx.amount;
  switch(tx.type){
    case 'income':return tx.accountId===accId?a:0;
    case 'expense':case 'goal_in':case 'debt':return tx.accountId===accId?-a:0;
    case 'goal_out':return tx.accountId===accId?a:0;
    case 'transfer':return(tx.accountId===accId?-a:0)+(tx.toAccountId===accId?a:0);
  }return 0;
}
function liquidEffect(tx){return{income:tx.amount,expense:-tx.amount,goal_in:-tx.amount,goal_out:tx.amount,debt:-tx.amount}[tx.type]||0}
function worthEffect(tx){return{income:tx.amount,expense:-tx.amount,debt:-(tx.interest||0)}[tx.type]||0}
function accBalance(id){const a=S.accounts.find(x=>x.id===id);if(!a)return 0;let b=a.initial||0;for(const t of allTx())b+=effect(t,id);return b}
function totals(){
  const acc=S.accounts.map(a=>({...a,bal:accBalance(a.id)}));
  const liquid=acc.reduce((s,a)=>s+a.bal,0);
  const saved=S.goals.reduce((s,g)=>s+(g.saved||0),0);
  const debt=S.debts.reduce((s,d)=>s+(d.balance||0),0);
  const byType={};acc.forEach(a=>byType[a.type]=(byType[a.type]||0)+a.bal);
  const cash=acc.filter(a=>a.type!=='card').reduce((s,a)=>s+a.bal,0);
  const cardDebt=acc.filter(a=>a.type==='card').reduce((s,a)=>s+Math.max(0,-a.bal),0);
  const money=cash+saved,owe=debt+cardDebt;
  return{acc,liquid,saved,debt,cash,cardDebt,money,owe,net:money-owe,worth:liquid+saved-debt,byType};
}
function monthStats(k){
  const txs=TX[k]||[];let inc=0,out=0,sav=0;const cats={};
  for(const t of txs){
    if(t.type==='income')inc+=t.amount;
    else if(t.type==='expense'||t.type==='debt'){out+=t.amount;const c=t.type==='debt'?'creditos':t.category;cats[c]=(cats[c]||0)+t.amount}
    else if(t.type==='goal_in')sav+=t.amount;else if(t.type==='goal_out')sav-=t.amount;
  }
  return{inc,out,sav,cats,net:inc-out};
}
function moneyEffect(tx){
  const card=id=>S.accounts.find(a=>a.id===id)?.type==='card';
  let e=0;for(const id of new Set([tx.accountId,tx.toAccountId]))if(id&&!card(id))e+=effect(tx,id);
  if(tx.type==='goal_in')e+=tx.amount;if(tx.type==='goal_out')e-=tx.amount;return e;
}
function worthHistory(days){
  const t=TODAY();let cur=totals().money;const pts=[];
  const byDay={};for(const x of allTx()){byDay[x.date]=(byDay[x.date]||0)+moneyEffect(x)}
  for(let i=0;i<days;i++){const d=addDays(t,-i);pts.unshift({d,v:cur});cur-=byDay[d]||0}
  return pts;
}
/* programados */
const clampDate=(y,m,day)=>iso(new Date(y,m-1,Math.min(day,dim(y,m))));
function advance(r,s){
  const d=pd(s);let y=d.getFullYear(),m=d.getMonth()+1;
  if(r.freq==='weekly')return addDays(s,7);
  if(r.freq==='biweekly'){const last=dim(y,m);if(d.getDate()<15)return clampDate(y,m,15);if(d.getDate()<last)return clampDate(y,m,31);m++;if(m>12){m=1;y++}return clampDate(y,m,15)}
  if(r.freq==='yearly')return clampDate(y+1,m,r.day||d.getDate());
  m++;if(m>12){m=1;y++}return clampDate(y,m,r.day||d.getDate());
}
function occurrences(r,until,max=40){const out=[];if(!r.active)return out;let d=r.next,i=0;while(d<=until&&i++<max){out.push(d);d=advance(r,d)}return out}
function upcoming(daysAhead=35){
  const t=TODAY(),until=addDays(t,daysAhead),list=[];
  for(const r of S.recurring){for(const d of occurrences(r,until,8))list.push({r,date:d,late:d<t,first:d===r.next})}
  return list.sort((a,b)=>a.date.localeCompare(b.date));
}
const monthlyRate=ea=>Math.pow(1+(ea||0)/100,1/12)-1;
function debtMonths(d){
  const r=monthlyRate(d.rate),B=d.balance,P=d.payment;if(!P||B<=0)return 0;
  if(r===0)return Math.ceil(B/P);
  if(P<=B*r)return Infinity;
  return Math.ceil(-Math.log(1-r*B/P)/Math.log(1+r));
}

/* ---------- mutaciones ---------- */
function addTx(tx){tx.id=tx.id||nid();const k=mkey(tx.date);(TX[k]=TX[k]||[]).push(tx);Sync.mark('tx-'+k);return tx}
function removeTx(id){
  for(const k in TX){const i=TX[k].findIndex(x=>x.id===id);if(i<0)continue;const tx=TX[k][i];
    if(tx.type==='goal_in'||tx.type==='goal_out'){const g=S.goals.find(g=>g.id===tx.goalId);if(g)g.saved+=tx.type==='goal_in'?-tx.amount:tx.amount;Sync.mark('state')}
    if(tx.type==='debt'){const d=S.debts.find(d=>d.id===tx.debtId);if(d){d.balance+=tx.capital||0;d.done=false;Sync.mark('state')}}
    TX[k].splice(i,1);Sync.mark('tx-'+k);return tx}
}
function payDebt(debtId,amount,accountId,date,opts={}){
  const d=S.debts.find(x=>x.id===debtId);if(!d)return;
  const interest=opts.extra?0:Math.min(amount,Math.round(d.balance*monthlyRate(d.rate)));
  const capital=Math.min(d.balance,Math.max(0,amount-interest));
  d.balance=Math.max(0,d.balance-capital);
  if(d.balance<=0){d.done=true;S.recurring.filter(r=>r.debtId===d.id).forEach(r=>r.active=false)}
  addTx({id:opts.id,date,type:'debt',amount,capital,interest,accountId,category:'creditos',note:opts.note||('Pago '+d.name),debtId,recurringId:opts.recurringId});
  Sync.mark('state');
}
function postRecurring(r,date,when){
  const id='r_'+r.id+'_'+date;if(findTx(id))return false;
  const d=when||date;
  if(r.debtId&&S.debts.find(x=>x.id===r.debtId))payDebt(r.debtId,r.amount,r.accountId,d,{id,note:r.name,recurringId:r.id});
  else addTx({id,date:d,type:r.kind,amount:r.amount,accountId:r.accountId,category:r.category,note:r.name,recurringId:r.id});
  return true;
}
function runAutomations(){
  if(!S)return;const t=TODAY();let n=0;
  for(const r of S.recurring){
    if(!r.active||!r.auto)continue;let g=0;
    while(r.active&&r.next<=t&&g++<36){if(postRecurring(r,r.next))n++;r.next=advance(r,r.next)}
  }
  if(n){Sync.mark('state');toast(n===1?'Se registró 1 pago automático':'Se registraron '+n+' pagos automáticos')}
}

/* ---------- consejos ---------- */
function dailyBudget(){
  const t=TODAY(),k=mkey(t),d=pd(t),end=k+'-'+pad(dim(d.getFullYear(),d.getMonth()+1));
  const ms=monthStats(k);let pIn=0,pOut=0;
  for(const r of S.recurring)for(const o of occurrences(r,end)){if(r.kind==='income')pIn+=r.amount;else pOut+=r.amount}
  const spentToday=(TX[k]||[]).filter(x=>x.date===t&&x.type==='expense'&&!x.recurringId&&!x.budgetId).reduce((s,x)=>s+x.amount,0);
  const available=ms.inc+pIn-ms.out-pOut-Math.max(0,ms.sav);
  const daysLeft=dim(d.getFullYear(),d.getMonth()+1)-d.getDate()+1;
  const allowance=Math.max(0,(available+spentToday)/daysLeft);
  return{allowance,spentToday,left:allowance-spentToday,available,daysLeft,pIn,pOut};
}
function avgMonthlyOut(n=3){const k=mkey(TODAY());let s=0,c=0;for(let i=1;i<=n;i++){const m=monthStats(shiftMonth(k,-i));if(m.out||m.inc){s+=m.out;c++}}return c?s/c:monthStats(k).out}
function avgMonthlyIn(n=3){const k=mkey(TODAY());let s=0,c=0;for(let i=1;i<=n;i++){const m=monthStats(shiftMonth(k,-i));if(m.out||m.inc){s+=m.inc;c++}}const rec=S.recurring.filter(r=>r.active&&r.kind==='income').reduce((a,r)=>a+(r.freq==='biweekly'?2:r.freq==='weekly'?4.3:r.freq==='yearly'?1/12:1)*r.amount,0);return c?s/c:rec}
function tips(){
  const out=[],T=totals(),k=mkey(TODAY()),ms=monthStats(k),prev=monthStats(shiftMonth(k,-1));
  const inc=avgMonthlyIn()||ms.inc,exp=avgMonthlyOut()||ms.out;
  // tasa de ahorro
  if(prev.inc>0){const rate=(prev.inc-prev.out)/prev.inc;
    if(rate>=.2)out.push({l:'good',t:`El mes pasado guardaste el ${Math.round(rate*100)}% de tus ingresos`,b:'Vas por encima del 20% recomendado. Mueve ese excedente a una caja de ahorro antes de que se diluya en gastos.'});
    else if(rate>=0)out.push({l:'info',t:`Tu tasa de ahorro fue ${Math.round(rate*100)}%`,b:`Apunta al 20%. Con tus ingresos serían ${money(prev.inc*.2)} al mes: prográmalos como aporte automático el día de pago.`});
    else out.push({l:'warn',t:'El mes pasado gastaste más de lo que ganaste',b:`La diferencia fue ${money(-prev.net)}. Revisa las categorías con más gasto y define un tope diario.`});}
  // 50/30/20
  if(ms.out>0&&inc>0){let need=0,want=0;for(const[c,v]of Object.entries(ms.cats)){const g=catById(c).g;if(g==='need'||g==='debt')need+=v;else want+=v}
    if(want/inc>.3)out.push({l:'warn',t:`Los gustos ya van en ${Math.round(want/inc*100)}% de tu ingreso`,b:'La regla 50/30/20 sugiere máximo 30% en gustos (salidas, domicilios, ropa, suscripciones).'});}
  // fondo de emergencia
  if(exp>0){const em=S.goals.find(g=>/emergen/i.test(g.name));const base=em?em.saved:T.cash;const months=base/exp;
    if(months<3)out.push({l:'warn',t:`Tu colchón cubre ${months.toFixed(1).replace('.',',')} meses de gastos`,b:`Lo ideal son 3 a 6 meses (${money(exp*3)} – ${money(exp*6)}). ${em?'Sigue aportando a tu fondo de emergencia.':'Crea una caja “Fondo de emergencia”.'}`});
    else out.push({l:'good',t:`Tienes ${months.toFixed(1).replace('.',',')} meses de gastos cubiertos`,b:'Tu fondo de emergencia está sano. Lo que sobre puede ir a metas o a abonar deudas caras.'});}
  // deudas
  const active=S.debts.filter(d=>d.balance>0);
  if(active.length&&inc>0){const pay=active.reduce((s,d)=>s+(d.payment||0),0),ratio=pay/inc;
    if(ratio>.3)out.push({l:'warn',t:`Tus cuotas se llevan el ${Math.round(ratio*100)}% del ingreso`,b:'Por encima del 30% el endeudamiento es riesgoso. Evita nuevos créditos hasta bajar de ese nivel.'});
    const top=[...active].sort((a,b)=>b.rate-a.rate)[0];
    if(top.rate>0)out.push({l:'info',t:`Abona extra a “${top.name}” primero`,b:`Tiene la tasa más alta (${top.rate}% E.A.). Cada abono a capital allí te ahorra más intereses (método avalancha).`});}
  // tarjetas
  T.acc.filter(a=>a.type==='card'&&a.bal<0).forEach(a=>out.push({l:'info',t:`Debes ${money(-a.bal)} en ${a.name}`,b:'Paga el total antes de la fecha de corte para no generar intereses. Úsala solo para lo que ya tienes en efectivo.'}));
  // próximos pagos vs disponible
  const up=upcoming(10).filter(u=>u.r.kind==='expense');const need=up.reduce((s,u)=>s+u.r.amount,0);
  const liquidNoCard=T.acc.filter(a=>a.type!=='card').reduce((s,a)=>s+a.bal,0);
  if(need>0&&need>liquidNoCard)out.push({l:'warn',t:'No te alcanza para los pagos de los próximos 10 días',b:`Necesitas ${money(need)} y tienes ${money(liquidNoCard)} disponibles fuera de tarjetas.`});
  const late=upcoming(0).filter(u=>u.late);
  if(late.length)out.push({l:'warn',t:`Tienes ${late.length} pago${late.length>1?'s':''} vencido${late.length>1?'s':''}`,b:late.slice(0,3).map(u=>u.r.name).join(', ')+'. Márcalos como pagados o págalos hoy para evitar intereses de mora.'});
  // pico de categoría
  const prevAvg={};for(let i=1;i<=3;i++){const m=monthStats(shiftMonth(k,-i));for(const[c,v]of Object.entries(m.cats))prevAvg[c]=(prevAvg[c]||0)+v/3}
  const d=pd(TODAY()),frac=d.getDate()/dim(d.getFullYear(),d.getMonth()+1);
  for(const[c,v]of Object.entries(ms.cats)){const avg=prevAvg[c]||0;if(avg>50000&&v>avg*1.25&&frac<.95){out.push({l:'warn',t:`${catById(c).n}: ya superaste tu promedio mensual`,b:`Llevas ${money(v)} este mes y tu promedio es ${money(avg)}.`});break}}
  // suscripciones
  const subs=S.recurring.filter(r=>r.active&&r.category==='suscripciones');
  if(subs.length>=2){const s=subs.reduce((a,r)=>a+r.amount,0);out.push({l:'info',t:`Pagas ${money(s)} al mes en ${subs.length} suscripciones`,b:`Son ${money(s*12)} al año. Cancela las que no usaste en el último mes.`})}
  // metas
  S.goals.filter(g=>g.deadline&&g.saved<g.target).forEach(g=>{const m=Math.max(1,Math.ceil(diffDays(TODAY(),g.deadline)/30));out.push({l:'info',t:`Para “${g.name}” aporta ${money((g.target-g.saved)/m)} al mes`,b:`Te faltan ${money(g.target-g.saved)} y ${m} mes${m>1?'es':''} para la fecha.`})});
  if(!out.length)out.push({l:'info',t:'Registra tus movimientos por unos días',b:'Con más datos podré darte consejos sobre tus hábitos de gasto.'});
  if(S.budget&&S.budget.items.length){const b=baseStats(k);
    if(b.close<0)out.push({l:'warn',t:`A este ritmo cierras ${MESL[Number(k.slice(5))-1]} con ${money(b.close)}`,b:`Para cumplir tu mes base, el día a día no debería pasar de ${money(Math.max(0,b.perDay))} diarios en los ${b.daysLeft} días que quedan.`});
    else if(b.daysLeft<=7)out.push({l:'good',t:`Cerrarías el mes con ${money(b.close)} a favor`,b:'Cuando cierre el mes, pasa ese sobrante a una caja de ahorro o abónalo al crédito más caro.'});}
  const order={warn:0,info:1,good:2};return out.sort((a,b)=>order[a.l]-order[b.l]);
}

const CHARTS={};
function smooth(p){if(p.length<2)return'';let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;

function areaChart(id,series,h=110){

  <linearGradient id="gs-${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--c-line)"/><stop offset="1" style="stop-color:var(--c-line2)"/></linearGradient>

}
function bindCharts(){
  $$('.chart[data-chart]').forEach(el=>{const c=CHARTS[el.dataset.chart];if(!c)return;
    const dot=$('.c-dot',el),tip=$('.c-tip',el),rule=$('.c-rule',el);const lastI=c.pts.length-1;
    const show=i=>{const p=c.pts[i];const x=p[0]/c.W*100;dot.style.left=x+'%';dot.style.top=p[1]/c.H*100+'%';rule.style.left=x+'%';rule.style.opacity=1;
      tip.textContent=fdate(c.series[i].d)+' · '+money(c.series[i].v);tip.style.left=Math.min(88,Math.max(12,x))+'%';tip.style.top='-26px';tip.style.opacity=1};
    const move=e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width;show(Math.round(Math.min(1,Math.max(0,x))*lastI))};

    el.addEventListener('pointerleave',()=>{tip.style.opacity=0;rule.style.opacity=0;const p=c.pts[lastI];dot.style.left=p[0]/c.W*100+'%';dot.style.top=p[1]/c.H*100+'%'});

/* ---------- mes base ---------- */
function baseStats(k){
  const t=TODAY(),cur=mkey(t),txs=TX[k]||[],skip=(S.budget.skip||{})[k]||[];
  const d0=pd(k+'-01'),dm=dim(d0.getFullYear(),d0.getMonth()+1);
  const elapsed=k<cur?dm:k>cur?0:pd(t).getDate(),daysLeft=dm-elapsed;
  const it=S.budget.items.map(i=>{const real=txs.filter(x=>x.budgetId===i.id).reduce((s,x)=>s+x.amount,0),skipped=skip.includes(i.id);
    return{...i,real,skipped,done:skipped||real>=i.amount,left:skipped?0:Math.max(0,i.amount-real)}});
  const sum=f=>it.filter(f).reduce((s,i)=>s+i.amount,0);
  const P={inFix:sum(i=>i.kind==='income'&&i.type==='fijo'),inOpt:sum(i=>i.kind==='income'&&i.type!=='fijo'),outFix:sum(i=>i.kind==='expense'&&i.type==='fijo'),outOpt:sum(i=>i.kind==='expense'&&i.type!=='fijo')};
  P.inc=P.inFix+P.inOpt;P.out=P.outFix+P.outOpt;P.free=P.inFix-P.out;
  const ms=monthStats(k);
  const baseIn=txs.filter(x=>x.budgetId&&x.type==='income').reduce((s,x)=>s+x.amount,0);
  const baseOut=txs.filter(x=>x.budgetId&&(x.type==='expense'||x.type==='debt')).reduce((s,x)=>s+x.amount,0);
  const varOut=ms.out-baseOut;
  const pendIn=it.filter(i=>i.kind==='income'&&i.type==='fijo'&&!i.done).reduce((s,i)=>s+i.left,0);
  const pendInOpt=it.filter(i=>i.kind==='income'&&i.type!=='fijo'&&!i.done).reduce((s,i)=>s+i.left,0);
  const pendOut=it.filter(i=>i.kind==='expense'&&!i.done).reduce((s,i)=>s+i.left,0);
  const varProj=elapsed?varOut/elapsed*dm:0,varMore=Math.max(0,varProj-varOut);
