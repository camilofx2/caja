function bindMoney(i){const f=()=>{const n=parseMoney(i.value);i.value=n?n.toLocaleString('es-CO'):''};i.addEventListener('input',f);f()}
const title=(t,x='')=>`<h2>${t}<button class="iconbtn" data-act="closeSheet" aria-label="Cerrar">${ico('x','sm')}</button></h2>${x}`;
const accOptions=(sel,exclude)=>S.accounts.filter(a=>a.id!==exclude).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)} · ${money(accBalance(a.id))}</option>`).join('');
const fld=(label,inner,id)=>`<div class="field"><label ${id?`for="${id}"`:''}>${label}</label>${inner}</div>`;
const val=id=>{const e=$('#'+id);return e?(e.type==='checkbox'?e.checked:e.value):''};
function confirmBox(msg,act,id){return `<div class="confirm" id="confirmbox" hidden><span>${msg}</span><div style="display:flex;gap:8px"><button type="button" class="btn danger" data-act="${act}" data-id="${id}">Sí, eliminar</button><button type="button" class="btn" data-act="hideConfirm">Cancelar</button></div></div>`}

function txSheet(type='expense',tx,prefill){
  const editing=!!tx&&!prefill;tx=tx||{type,amount:0,date:TODAY(),accountId:S.accounts[0]?.id,category:type==='income'?'salario':'comida',note:''};
  let cur=tx.type,cat=tx.category;
  const baseSelect=()=>{const its=(S.budget?.items||[]).filter(i=>i.kind===(cur==='income'?'income':'expense'));if(!its.length)return '';
    let sel=tx.budgetId;if(sel===undefined&&!editing){const m=its.filter(i=>i.category===cat);sel=m.length===1?m[0].id:''}
    return fld('¿Es un rubro de tu mes base?',`<select id="f-base"><option value="">No, es del día a día</option>${its.map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.name)} · ${moneyS(i.amount)}</option>`).join('')}</select>`,'f-base')};
  const draw=()=>{
    const cats=cur==='income'?CATS.income:CATS.expense;if(cur!=='transfer'&&!cats.find(c=>c.id===cat))cat=cats[0].id;
    return `${title(editing?'Editar movimiento':'Nuevo movimiento')}
    <form class="form" id="txform">
     <div class="seg" role="group">${[['expense','Gasto'],['income','Ingreso'],['transfer','Transferir']].map(([v,l])=>`<button type="button" data-t="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>
     <div class="amount"><span>$</span><input id="f-amount" data-money inputmode="numeric" autocomplete="off" placeholder="0" value="${tx.amount||''}" autofocus aria-label="Monto"></div>
     ${cur!=='transfer'?`<div class="field"><span class="lbl">Categoría</span><div class="chips">${cats.map(c=>`<button type="button" data-c="${c.id}" aria-pressed="${c.id===cat}">${c.n}</button>`).join('')}</div></div>`:''}
     ${cur!=='transfer'?baseSelect():''}
     <div class="row2">${fld(cur==='transfer'?'Desde':cur==='income'?'Entra a':'Pagado con',`<select id="f-acc">${accOptions(tx.accountId)}</select>`,'f-acc')}
     ${cur==='transfer'?fld('Hacia',`<select id="f-to">${accOptions(tx.toAccountId||S.accounts.find(a=>a.id!==tx.accountId)?.id)}</select>`,'f-to'):fld('Fecha',`<input id="f-date" type="date" value="${tx.date}">`,'f-date')}</div>
     ${cur==='transfer'?fld('Fecha',`<input id="f-date" type="date" value="${tx.date}">`,'f-date'):''}
     ${fld('Nota',`<input id="f-note" placeholder="${cur==='income'?'Ej: pago cliente':'Ej: almuerzo, gasolina'}" value="${esc(tx.note)}">`,'f-note')}
     <button class="btn primary block" type="submit">${editing?'Guardar cambios':'Registrar'}</button>
     ${editing?`<button type="button" class="btn danger block" data-act="showConfirm">Eliminar movimiento</button>${confirmBox('¿Eliminar este movimiento? Los saldos se recalculan.','delTx',tx.id)}`:''}
    </form>`};
  const mount=s=>{
    s.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){const a=parseMoney(val('f-amount'));tx.amount=a;tx.note=val('f-note');tx.accountId=val('f-acc');cur=t.dataset.t;s.innerHTML='<div class="grab"></div>'+draw();bindMoney($('#f-amount',s));return}
      const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;$$('[data-c]',s).forEach(b=>b.setAttribute('aria-pressed',b===c));
        const fb=$('#f-base',s);if(fb&&!fb.dataset.touched&&!editing){const m=S.budget.items.filter(i=>i.kind===(cur==='income'?'income':'expense')&&i.category===cat);fb.value=m.length===1?m[0].id:''}}});
    s.addEventListener('change',e=>{if(e.target.id==='f-base'){e.target.dataset.touched='1';tx.budgetId=e.target.value}});
    s.addEventListener('submit',e=>{e.preventDefault();const amount=parseMoney(val('f-amount'));if(!amount){toast('Escribe un monto');return}
      const acc=val('f-acc'),to=val('f-to');if(cur==='transfer'&&acc===to){toast('Elige dos cuentas distintas');return}
      if(editing)removeTx(tx.id);
      addTx({id:editing?tx.id:undefined,date:val('f-date')||TODAY(),type:cur,amount,accountId:acc,toAccountId:cur==='transfer'?to:undefined,category:cur==='transfer'?undefined:cat,note:val('f-note').trim(),budgetId:cur==='transfer'?undefined:(val('f-base')||undefined)});
      closeSheet();toast(editing?'Movimiento actualizado':cur==='income'?'Ingreso registrado':cur==='transfer'?'Transferencia registrada':'Gasto registrado');render()});
  };
  openSheet(draw(),mount);
}

function recSheet(r){
  const editing=!!r;r=r||{name:'',kind:'expense',amount:0,freq:'monthly',next:TODAY(),accountId:S.accounts[0]?.id,category:'servicios',auto:false,active:true};
  const catOpts=k=>(k==='income'?CATS.income:CATS.expense).map(c=>`<option value="${c.id}" ${c.id===r.category?'selected':''}>${c.n}</option>`).join('');
  openSheet(`${title(editing?'Editar programado':'Programar pago o ingreso')}
  <form class="form" id="recform">
   ${fld('Nombre',`<input id="r-name" required placeholder="Ej: Sueldo, Plan celular, Netflix" value="${esc(r.name)}" autofocus>`,'r-name')}
   <div class="row2">${fld('Tipo',`<select id="r-kind"><option value="expense" ${r.kind==='expense'?'selected':''}>Pago / egreso</option><option value="income" ${r.kind==='income'?'selected':''}>Ingreso</option></select>`,'r-kind')}
   ${fld('Monto',`<input id="r-amount" data-money inputmode="numeric" value="${r.amount||''}" placeholder="$0">`,'r-amount')}</div>
   <div class="row2">${fld('Frecuencia',`<select id="r-freq">${Object.entries(FREQ).map(([k,v])=>`<option value="${k}" ${k===r.freq?'selected':''}>${v}</option>`).join('')}</select>`,'r-freq')}
   ${fld('Próxima fecha',`<input id="r-next" type="date" value="${r.next}">`,'r-next')}</div>
   <div class="row2">${fld('Cuenta',`<select id="r-acc">${accOptions(r.accountId)}</select>`,'r-acc')}
   ${fld('Categoría',`<select id="r-cat">${catOpts(r.kind)}</select>`,'r-cat')}</div>
   ${S.debts.length?fld('Vinculado a una deuda (opcional)',`<select id="r-debt"><option value="">Ninguna</option>${S.debts.map(d=>`<option value="${d.id}" ${d.id===r.debtId?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`,'r-debt'):''}
   <label class="toggle"><span>Registrar automáticamente<small>Al llegar la fecha se anota solo, sin que confirmes.</small></span><input type="checkbox" class="sw" id="r-auto" ${r.auto?'checked':''}></label>
   ${editing?`<label class="toggle"><span>Activo<small>Pausa para dejar de contarlo.</small></span><input type="checkbox" class="sw" id="r-active" ${r.active?'checked':''}></label>`:''}
   <button class="btn primary block" type="submit">${editing?'Guardar':'Programar'}</button>
   ${editing?`<button type="button" class="btn danger block" data-act="showConfirm">Eliminar programado</button>${confirmBox('¿Eliminar este programado? Los movimientos ya registrados se conservan.','delRec',r.id)}`:''}
  </form>`,s=>{
    $('#r-kind',s).addEventListener('change',e=>{r.kind=e.target.value;$('#r-cat',s).innerHTML=catOpts(r.kind)});
    s.addEventListener('submit',e=>{e.preventDefault();const amount=parseMoney(val('r-amount'));if(!amount||!val('r-name').trim()){toast('Completa nombre y monto');return}
      const next=val('r-next')||TODAY();
      const o={...r,id:r.id||nid(),name:val('r-name').trim(),kind:val('r-kind'),amount,freq:val('r-freq'),next,day:pd(next).getDate(),accountId:val('r-acc'),category:val('r-cat'),auto:val('r-auto'),active:editing?val('r-active'):true,debtId:val('r-debt')||undefined};
      if(editing)S.recurring[S.recurring.findIndex(x=>x.id===r.id)]=o;else S.recurring.push(o);
      Sync.mark('state');runAutomations();closeSheet();toast(editing?'Programado actualizado':'Programado');render()});
  });
}
function paySheet(r){
  openSheet(`${title(r.kind==='income'?'Confirmar ingreso':'Registrar pago')}
  <form class="form"><div class="muted">${esc(r.name)} · vence ${fdate(r.next)}</div>
   <div class="amount"><span>$</span><input id="p-amount" data-money inputmode="numeric" value="${r.amount}" aria-label="Monto"></div>
   <div class="row2">${fld('Cuenta',`<select id="p-acc">${accOptions(r.accountId)}</select>`,'p-acc')}${fld('Fecha',`<input id="p-date" type="date" value="${TODAY()}">`,'p-date')}</div>
   <button class="btn primary block" type="submit">${r.kind==='income'?'Marcar como recibido':'Marcar como pagado'}</button>
   <button class="btn block" type="button" data-act="skipRec" data-id="${r.id}">Omitir esta vez</button>
  </form>`,s=>s.addEventListener('submit',e=>{e.preventDefault();
    const amount=parseMoney(val('p-amount'));const rr={...r,amount,accountId:val('p-acc')};
    postRecurring(rr,r.next,val('p-date')||TODAY());r.next=advance(r,r.next);Sync.mark('state');closeSheet();toast('Listo, registrado');render()}));
}
function goalSheet(g){
  const editing=!!g;g=g||{name:'',target:0,saved:0,deadline:''};
  openSheet(`${title(editing?'Editar caja':'Nueva caja de ahorro')}
  <form class="form">${fld('Nombre',`<input id="g-name" required placeholder="Ej: Cambiar llantas de la moto" value="${esc(g.name)}" autofocus>`,'g-name')}
   <div class="row2">${fld('Meta',`<input id="g-target" data-money inputmode="numeric" value="${g.target||''}" placeholder="$0">`,'g-target')}
   ${fld('Fecha límite (opcional)',`<input id="g-date" type="date" value="${g.deadline||''}">`,'g-date')}</div>
   ${editing?'':fld('¿Ya tienes algo ahorrado? (opcional)',`<input id="g-saved" data-money inputmode="numeric" placeholder="$0">`,'g-saved')}
   <button class="btn primary block" type="submit">${editing?'Guardar':'Crear caja'}</button>
   ${editing?`<button type="button" class="btn danger block" data-act="showConfirm">Eliminar caja</button>${confirmBox('¿Eliminar esta caja? Su historial de aportes se conserva en movimientos.','delGoal',g.id)}`:''}
  </form>`,s=>s.addEventListener('submit',e=>{e.preventDefault();const target=parseMoney(val('g-target'));if(!target||!val('g-name').trim()){toast('Completa nombre y meta');return}
    if(editing)Object.assign(g,{name:val('g-name').trim(),target,deadline:val('g-date')});else S.goals.push({id:nid(),name:val('g-name').trim(),target,saved:parseMoney(val('g-saved')),deadline:val('g-date')});
    Sync.mark('state');closeSheet();toast(editing?'Caja actualizada':'Caja creada');render()}));
}
function goalMoveSheet(g,dir){
  openSheet(`${title(dir==='in'?'Aportar a '+esc(g.name):'Retirar de '+esc(g.name))}
  <form class="form"><div class="amount"><span>$</span><input id="m-amount" data-money inputmode="numeric" placeholder="0" autofocus aria-label="Monto"></div>
   ${fld(dir==='in'?'Sale de':'Entra a',`<select id="m-acc">${accOptions(S.accounts.find(a=>a.type!=='card')?.id)}</select>`,'m-acc')}
   <div class="muted" style="font-size:13px">${dir==='in'?'El dinero sale de la cuenta y queda apartado en la caja.':'Disponible en la caja: '+money(g.saved)}</div>
   <button class="btn primary block" type="submit">${dir==='in'?'Aportar':'Retirar'}</button></form>`,
  s=>s.addEventListener('submit',e=>{e.preventDefault();const a=parseMoney(val('m-amount'));if(!a)return toast('Escribe un monto');if(dir==='out'&&a>g.saved)return toast('No hay tanto en la caja');
    g.saved+=dir==='in'?a:-a;addTx({date:TODAY(),type:dir==='in'?'goal_in':'goal_out',amount:a,accountId:val('m-acc'),category:'ahorro',note:(dir==='in'?'Aporte · ':'Retiro · ')+g.name,goalId:g.id});
    Sync.mark('state');closeSheet();toast(dir==='in'?'Aporte guardado':'Retiro registrado');render()}));
}
function debtSheet(d){
  const editing=!!d;d=d||{name:'',entity:'',original:0,balance:0,rate:0,payment:0};
  openSheet(`${title(editing?'Editar deuda':'Nueva deuda o crédito')}
  <form class="form">${fld('Nombre',`<input id="d-name" required placeholder="Ej: Crédito moto, Préstamo" value="${esc(d.name)}" autofocus>`,'d-name')}
   ${fld('Entidad',`<input id="d-entity" placeholder="Ej: Bancolombia" value="${esc(d.entity)}">`,'d-entity')}
   <div class="row2">${fld('Monto original',`<input id="d-orig" data-money inputmode="numeric" value="${d.original||''}" placeholder="$0">`,'d-orig')}
   ${fld('Saldo actual',`<input id="d-bal" data-money inputmode="numeric" value="${d.balance||''}" placeholder="$0">`,'d-bal')}</div>
   <div class="row2">${fld('Tasa % E.A.',`<input id="d-rate" type="number" step="0.01" min="0" inputmode="decimal" value="${d.rate||''}" placeholder="0">`,'d-rate')}
   ${fld('Cuota mensual',`<input id="d-pay" data-money inputmode="numeric" value="${d.payment||''}" placeholder="$0">`,'d-pay')}</div>
   ${editing?'':`<div class="row2">${fld('Día de pago',`<input id="d-day" type="number" min="1" max="31" value="15">`,'d-day')}${fld('Se paga desde',`<select id="d-acc">${accOptions()}</select>`,'d-acc')}</div>
   <label class="toggle"><span>Crear pago programado mensual<small>Aparecerá en Pagos con su fecha.</small></span><input type="checkbox" class="sw" id="d-rec" checked></label>`}
   <button class="btn primary block" type="submit">${editing?'Guardar':'Agregar deuda'}</button>
   ${editing?`<button type="button" class="btn danger block" data-act="showConfirm">Eliminar deuda</button>${confirmBox('¿Eliminar esta deuda y sus pagos programados?','delDebt',d.id)}`:''}
  </form>`,s=>s.addEventListener('submit',e=>{e.preventDefault();const bal=parseMoney(val('d-bal'));if(!val('d-name').trim()||!bal&&!editing){toast('Completa nombre y saldo');return}
    const o={name:val('d-name').trim(),entity:val('d-entity').trim(),original:parseMoney(val('d-orig'))||bal,balance:bal,rate:Number(val('d-rate'))||0,payment:parseMoney(val('d-pay'))};
    if(editing)Object.assign(d,o);else{const id=nid();S.debts.push({id,...o});
      if(val('d-rec')&&o.payment){const day=Math.min(31,Math.max(1,Number(val('d-day'))||15));const t=pd(TODAY());let y=t.getFullYear(),m=t.getMonth()+1;if(t.getDate()>day){m++;if(m>12){m=1;y++}}
        S.recurring.push({id:nid(),name:'Cuota '+o.name,kind:'expense',amount:o.payment,freq:'monthly',day,next:clampDate(y,m,day),accountId:val('d-acc'),category:'creditos',auto:false,active:true,debtId:id})}}
    Sync.mark('state');closeSheet();toast(editing?'Deuda actualizada':'Deuda agregada');render()}));
}
function payDebtSheet(d,extra){
  openSheet(`${title(extra?'Abono a capital':'Pagar cuota')}
  <form class="form"><div class="muted">${esc(d.name)} · saldo ${money(d.balance)}${!extra&&d.rate?' · interés estimado '+money(d.balance*monthlyRate(d.rate)):''}</div>
   <div class="amount"><span>$</span><input id="dp-amount" data-money inputmode="numeric" value="${extra?'':d.payment||''}" autofocus aria-label="Monto"></div>
   <div class="row2">${fld('Desde',`<select id="dp-acc">${accOptions()}</select>`,'dp-acc')}${fld('Fecha',`<input id="dp-date" type="date" value="${TODAY()}">`,'dp-date')}</div>
   <button class="btn primary block" type="submit">Registrar pago</button></form>`,
  s=>s.addEventListener('submit',e=>{e.preventDefault();const a=parseMoney(val('dp-amount'));if(!a)return toast('Escribe un monto');
    payDebt(d.id,a,val('dp-acc'),val('dp-date')||TODAY(),{extra,note:(extra?'Abono capital · ':'Cuota · ')+d.name});
    const r=S.recurring.find(r=>r.debtId===d.id&&r.active&&!extra);if(r&&diffDays(TODAY(),r.next)<=10)r.next=advance(r,r.next);
    Sync.mark('state');closeSheet();toast(d.balance<=0?'¡Deuda pagada por completo!':'Pago registrado');render()}));
}
function accSheet(a){
  const editing=!!a;a=a||{name:'',type:'bank',initial:0};const bal=editing?accBalance(a.id):0;
  openSheet(`${title(editing?'Editar cuenta':'Nueva cuenta')}
  <form class="form">${fld('Nombre',`<input id="a-name" required placeholder="Ej: Bancolombia, Nequi, Efectivo" value="${esc(a.name)}" autofocus>`,'a-name')}
   ${fld('Tipo',`<select id="a-type">${Object.entries(ACC_TYPES).map(([k,v])=>`<option value="${k}" ${k===a.type?'selected':''}>${v}</option>`).join('')}</select>`,'a-type')}
   ${fld(`<span id="a-lbl">${a.type==='card'?'Deuda actual en la tarjeta':'Saldo actual'}</span>`,`<input id="a-bal" data-money inputmode="numeric" value="${Math.abs(bal)||''}" placeholder="$0">`,'a-bal')}
   <div id="a-limitwrap" ${a.type==='card'?'':'hidden'}>${fld('Cupo total (opcional)',`<input id="a-limit" data-money inputmode="numeric" value="${a.limit||''}" placeholder="$0">`,'a-limit')}</div>
   <button class="btn primary block" type="submit">${editing?'Guardar':'Crear cuenta'}</button>
   ${editing&&S.accounts.length>1?`<button type="button" class="btn danger block" data-act="showConfirm">Eliminar cuenta</button>${confirmBox('¿Eliminar esta cuenta? Sus movimientos se conservan pero dejarán de sumar.','delAcc',a.id)}`:''}
  </form>`,s=>{
    $('#a-type',s).addEventListener('change',e=>{const c=e.target.value==='card';$('#a-lbl',s).textContent=c?'Deuda actual en la tarjeta':'Saldo actual';$('#a-limitwrap',s).hidden=!c});
    s.addEventListener('submit',e=>{e.preventDefault();if(!val('a-name').trim())return toast('Ponle un nombre');
      const type=val('a-type'),want=parseMoney(val('a-bal'))*(type==='card'?-1:1);
      if(editing){const cur=accBalance(a.id);Object.assign(a,{name:val('a-name').trim(),type,limit:parseMoney(val('a-limit'))||undefined});a.initial=(a.initial||0)+(want-cur)}
      else{const o={id:nid(),name:val('a-name').trim(),type,initial:want,limit:parseMoney(val('a-limit'))||undefined};S.accounts.push(o)}
      Sync.mark('state');closeSheet();toast(editing?'Cuenta actualizada':'Cuenta creada');render()})});
}
function settingsSheet(){
  const cfg=Sync.configured();
  const syncTxt={synced:'Tus datos están en tu base de datos privada y se sincronizan entre el iPhone y el Mac.',connecting:'Conectando…',error:'Sin conexión. Los cambios quedan en este dispositivo y se envían al reconectar.',local:cfg?'No has iniciado sesión: los datos se guardan solo en este dispositivo.':'La sincronización aún no está configurada (archivo config.js). Los datos se guardan solo en este dispositivo.'}[Sync.status];
  openSheet(`${title('Ajustes')}
  <form class="form" id="setform">
   ${fld('Tu nombre',`<input id="s-name" value="${esc(S.settings.name)}" placeholder="Para saludarte">`,'s-name')}
   <button class="btn primary block" type="submit">Guardar</button>
  </form>
  <div class="section-title">Cuenta y sincronización</div><div class="toggle" style="display:block">${syncPill()}<p class="muted" style="margin:8px 0 0;font-size:13.5px">${syncTxt}</p>
   ${Sync.uid?`<p class="muted" style="font-size:13px;margin:8px 0 10px">Conectado como <b style="color:var(--ink)">${esc(Sync.email)}</b></p><button class="btn" data-act="logout">Cerrar sesión</button>`:cfg?`<div style="margin-top:10px"><button class="btn primary" data-act="login">Iniciar sesión</button></div>`:''}</div>
  <div class="section-title">Instalar</div>
  <ol class="steps"><li><b>iPhone:</b> abre la app en Safari → botón Compartir → “Agregar a pantalla de inicio”.</li><li><b>Mac:</b> ábrela en Safari → menú Archivo → “Agregar al Dock”.</li></ol>
  <div class="section-title">Cuentas y datos</div>
  <div style="display:flex;flex-direction:column;gap:8px">
   <button class="btn block" data-act="goAccounts">${ico('wallet','sm')}Administrar cuentas</button>
   <button class="btn block" data-act="exportData">Descargar copia de seguridad</button>
   <label class="btn block" for="importfile" style="cursor:pointer">Restaurar copia de seguridad</label><input type="file" id="importfile" accept="application/json,.json" hidden>
   <button class="btn danger block" data-act="showConfirm">Borrar todos los datos</button>
   ${confirmBox('Se borran cuentas, movimientos, metas y deudas en todos tus dispositivos. No se puede deshacer.','wipe','all')}
  </div>`,s=>{
    s.addEventListener('submit',e=>{e.preventDefault();S.settings.name=val('s-name').trim();Sync.mark('state');closeSheet();render()});
    $('#importfile',s).addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.S||!j.TX)throw 0;
      const old=Object.keys(TX);S=j.S;TX=j.TX;Sync.mark('state',...new Set([...old,...Object.keys(TX)].map(k=>'tx-'+k)));closeSheet();toast('Copia restaurada');render()}catch(err){toast('Ese archivo no es una copia válida de Caja')}});
  });
}

/* ---------- acciones ---------- */
const ACT={
  closeSheet:()=>closeSheet(),
  newTx:d=>txSheet(d.type||'expense'),
  editTx:d=>{const t=findTx(d.id);if(!t)return;if(['goal_in','goal_out','debt'].includes(t.type)){openSheet(`${title('Movimiento')}<div class="rows">${txRow(t).replace('<button class="row"','<div class="row"').replace(/<\/button>$/,'</div>')}</div><div class="muted" style="font-size:13px;margin:10px 0 14px">${fdate(t.date)} · Los aportes y pagos de deuda no se editan; elimínalo y regístralo de nuevo.</div><button class="btn danger block" data-act="showConfirm">Eliminar</button>${confirmBox('¿Eliminar? Se revierte el efecto en la caja o deuda.','delTx',t.id)}`);return}txSheet(t.type,clone(t))},
  delTx:d=>{removeTx(d.id);closeSheet();toast('Movimiento eliminado');render()},
  showConfirm:(d,el)=>{const c=$('#confirmbox');if(c){c.hidden=false;c.scrollIntoView({block:'nearest'})}},
  hideConfirm:()=>{const c=$('#confirmbox');if(c)c.hidden=true},
  month:d=>{UI.month=shiftMonth(UI.month,Number(d.d));UI.animNext=true;render()},
  filter:d=>{UI.filter=d.v;render()},
  metasTab:d=>{UI.metasTab=d.v;UI.animNext=true;render()},
  editRec:d=>recSheet(d.id?clone(S.recurring.find(r=>r.id===d.id)):null),
  delRec:d=>{S.recurring=S.recurring.filter(r=>r.id!==d.id);Sync.mark('state');closeSheet();toast('Programado eliminado');render()},
  payRec:d=>{const r=S.recurring.find(r=>r.id===d.id);if(r)paySheet(r)},
  skipRec:d=>{const r=S.recurring.find(r=>r.id===d.id);if(r){r.next=advance(r,r.next);Sync.mark('state');closeSheet();toast('Omitido hasta '+fdate(r.next));render()}},
  editGoal:d=>goalSheet(d.id?S.goals.find(g=>g.id===d.id):null),
  delGoal:d=>{S.goals=S.goals.filter(g=>g.id!==d.id);Sync.mark('state');closeSheet();render()},
  goalMove:d=>goalMoveSheet(S.goals.find(g=>g.id===d.id),d.dir),
  editDebt:d=>debtSheet(d.id?S.debts.find(x=>x.id===d.id):null),
  delDebt:d=>{S.debts=S.debts.filter(x=>x.id!==d.id);S.recurring=S.recurring.filter(r=>r.debtId!==d.id);Sync.mark('state');closeSheet();render()},
  payDebt:d=>payDebtSheet(S.debts.find(x=>x.id===d.id),!!d.extra),
  editAcc:d=>accSheet(d.id?S.accounts.find(a=>a.id===d.id):null),
  delAcc:d=>{S.accounts=S.accounts.filter(a=>a.id!==d.id);Sync.mark('state');closeSheet();render()},
  settings:()=>settingsSheet(),
  goAccounts:()=>{closeSheet();location.hash='cuentas'},
  login:()=>{closeSheet();showLogin()},
  logout:async()=>{try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem(LS)}catch(e){}location.reload()},
  editBase:d=>baseItemSheet(d.id?clone(S.budget.items.find(x=>x.id===d.id)):null),
  delBase:d=>{S.budget.items=S.budget.items.filter(x=>x.id!==d.id);Sync.mark('state');closeSheet();toast('Rubro eliminado');render()},
  baseCheck:d=>baseCheckSheet(S.budget.items.find(x=>x.id===d.id)),
  baseSkip:d=>{const k=mkey(TODAY());const sk=S.budget.skip[k]=S.budget.skip[k]||[];if(!sk.includes(d.id))sk.push(d.id);Sync.mark('state');closeSheet();toast('Marcado como no aplica este mes');render()},
  baseUndo:d=>{const k=mkey(TODAY());(TX[k]||[]).filter(x=>x.budgetId===d.id).map(x=>x.id).forEach(removeTx);if(S.budget.skip[k]){S.budget.skip[k]=S.budget.skip[k].filter(x=>x!==d.id);Sync.mark('state')}closeSheet();toast('Desmarcado');render()},
  goDebts:()=>{UI.metasTab='deudas';if(UI.view==='metas'){UI.animNext=true;render()}else location.hash='metas'},
  goGoals:()=>{UI.metasTab='ahorro';if(UI.view==='metas'){UI.animNext=true;render()}else location.hash='metas'},
  payCard:d=>{const a=S.accounts.find(x=>x.id===d.id);if(!a)return;txSheet('transfer',{type:'transfer',amount:Math.max(0,-accBalance(a.id)),date:TODAY(),accountId:S.accounts.find(x=>x.type!=='card')?.id,toAccountId:a.id,note:'Pago '+a.name},true)},
  startFresh:()=>{openSheet(`${title('Empezar con tus datos')}<p class="muted" style="margin:0 0 16px">Se borran los datos de ejemplo. Luego agrega tus cuentas (bancos, Nequi, efectivo, tarjetas) con su saldo actual y programa tu sueldo y pagos fijos.</p><button class="btn primary block" data-act="wipe">Borrar ejemplo y empezar</button>`)},
  wipe:()=>{const old=Object.keys(TX),keepBase=S.budget;S=emptyState();if(keepBase)S.budget=keepBase;TX={};old.forEach(k=>TX[k]=[]);Sync.mark('state',...old.map(k=>'tx-'+k));TX={};closeSheet();UI.animNext=true;location.hash='cuentas';go('cuentas');setTimeout(()=>accSheet(),350)},
  exportData:async()=>{const data=JSON.stringify({app:'caja',exported:new Date().toISOString(),S,TX},null,1);const name='caja-finanzas-'+TODAY()+'.json';
    
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click();}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.tagName==='BUTTON'||a.classList.contains('backdrop'))e.preventDefault();ACT[a.dataset.act]?.(a.dataset,a,e)});

/* ---------- arranque ---------- */
Sync.loadLocal();
if(!S)S=emptyState();
runAutomations();
UI.view=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'inicio';
render();
Sync.connect().catch(()=>setSync('local'));
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
